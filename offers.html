<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offers & Deals | Aaradhya Mart</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2310243b'/><text x='50' y='68' font-size='55' font-family='Georgia' fill='%23c5a36b' text-anchor='middle'>A</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    /* HERO */
    .offers-hero { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); color: #fff; padding: 60px 7% 50px; text-align: center; position: relative; overflow: hidden; }
    .offers-hero::before { content: "🎉"; position: absolute; font-size: 250px; opacity: 0.1; left: -20px; top: -30px; transform: rotate(-15deg); }
    .offers-hero h1 { font: normal 42px Georgia, serif; margin: 0 0 10px; color: #fff; position: relative; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
    .offers-hero p { font-size: 15px; color: #fee2e2; max-width: 600px; margin: 0 auto; position: relative; }

    .offers-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .section-title { font: normal 28px Georgia, serif; color: var(--navy); margin: 40px 0 20px; display: flex; align-items: center; gap: 10px; }

    /* COUPONS GRID */
    .coupons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 50px; }
    
    .coupon-card { display: flex; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; }
    .coupon-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-color: var(--gold); }
    
    .coupon-left { background: var(--navy); color: var(--gold); padding: 20px 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 100px; border-right: 2px dashed #fff; }
    .coupon-left h3 { margin: 0; font-size: 26px; font-family: Georgia, serif; font-weight: bold; }
    .coupon-left p { margin: 2px 0 0; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
    
    .coupon-right { padding: 15px 20px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .coupon-right h4 { margin: 0 0 5px; font-size: 15px; color: var(--navy); }
    .coupon-right p { margin: 0 0 12px; font-size: 12px; color: #777; line-height: 1.4; }
    
    .coupon-code-box { display: inline-flex; align-items: center; gap: 10px; }
    .coupon-code-box span { background: #f8f9fa; border: 1px dashed #999; padding: 6px 12px; border-radius: 4px; font-family: monospace; font-weight: bold; color: var(--navy); font-size: 14px; }
    .copy-btn { background: none; border: none; color: #10b981; font-size: 11px; font-weight: bold; cursor: pointer; text-decoration: underline; padding: 0; }
    .copy-btn:hover { color: #047857; }

    .coupon-card::before, .coupon-card::after { content: ''; position: absolute; width: 16px; height: 16px; background-color: #f4f6f8; border-radius: 50%; left: 92px; border: 1px solid #e0e0e0; }
    .coupon-card::before { top: -8px; border-bottom-color: transparent; border-right-color: transparent; transform: rotate(-45deg); }
    .coupon-card::after { bottom: -8px; border-top-color: transparent; border-right-color: transparent; transform: rotate(45deg); }

    /* DEALS GRID */
    .deals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    
    .deal-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); transition: 0.3s; display: flex; flex-direction: column; height: 100%; position: relative; }
    .deal-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(16,36,59,0.1); border-color: var(--gold); }
    
    .deal-img-wrap { position: relative; width: 100%; aspect-ratio: 1/1; background: #f8f9fa; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
    .deal-img-wrap img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
    .deal-tag { position: absolute; top: 8px; left: 8px; background: #ef4444; color: #fff; padding: 4px 8px; font-size: 10px; font-weight: bold; border-radius: 4px; box-shadow: 0 2px 6px rgba(239,68,68,0.3); }
    
    .deal-card h3 { font-size: 13px; margin: 0 0 5px; line-height: 1.35; height: 36px; overflow: hidden; color: var(--navy); font-weight: bold; }
    .deal-price { font-size: 16px; font-weight: bold; color: var(--navy); display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .deal-price span { font-size: 11px; color: #999; text-decoration: line-through; font-weight: normal; }
    .discount-badge { display: inline-block; background: #10b981; color: #fff; font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
    
    .btn-view-product { display: block; text-align: center; margin-top: auto; background: var(--navy); color: #fff; padding: 10px; border-radius: 6px; font-size: 12px; font-weight: bold; text-decoration: none; transition: 0.2s; }
    .btn-view-product:hover { background: #1e3a5f; }

    @media (max-width: 650px) {
      .offers-hero h1 { font-size: 32px; }
      .coupons-grid { grid-template-columns: 1fr; }
      .deals-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .coupon-card::before, .coupon-card::after { left: 87px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">AM</span><span><strong>AARADHYA MART</strong><small>OFFERS & DEALS</small></span></a>
    <a href="index.html" class="header-wa" style="background:#fff; color:var(--navy); border:1px solid var(--navy);">← Back to Home</a>
  </header>

  <div class="offers-hero">
    <h1>🔥 Today's Best Offers</h1>
    <p>Grab exclusive discounts, use coupons, and save big on your favorite products.</p>
  </div>

  <div class="offers-container">
    
    <h2 class="section-title">🎟️ Available Coupons</h2>
    <div class="coupons-grid" id="couponsGrid">
      <p style="grid-column: 1/-1; text-align:center; color:#777; padding:20px;">Loading coupons...</p>
    </div>

    <h2 class="section-title">🔥 Deal of the Day</h2>
    <div class="deals-grid" id="dealsGrid">
      <p style="grid-column: 1/-1; text-align:center; color:#777; padding:20px;">Loading deals...</p>
    </div>

  </div>

  <footer class="site-footer" style="margin-top: 50px;">
    <div class="footer-links" style="display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; flex-wrap: wrap;">
      <a href="index.html">Home</a>
      <a href="offers.html">Offers</a>
      <a href="support.html">Support</a>
    </div>
    <p>© 2026 Aaradhya Mart. All rights reserved.</p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAffhI69b-piezGsdI5E1lUVcNj9nobG8Y", authDomain: "aaradhya-mart.firebaseapp.com", projectId: "aaradhya-mart", storageBucket: "aaradhya-mart.firebasestorage.app", messagingSenderId: "146782544824", appId: "1:146782544824:web:d605e1971d3480fab1654d" };
    const app = initializeApp(firebaseConfig); 
    const db = getFirestore(app);

    // ✅ Load Coupons
    async function loadCoupons() {
      try {
        const snap = await getDocs(collection(db, "coupons"));
        const grid = document.getElementById("couponsGrid");
        
        if(snap.empty) {
          grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#777;'>No active coupons right now. Please check back later!</p>";
          return;
        }

        let html = "";
        snap.forEach(d => {
          const c = d.data();
          html += `
            <div class="coupon-card">
              <div class="coupon-left">
                <h3>${c.discount}%</h3>
                <p>OFF</p>
              </div>
              <div class="coupon-right">
                <h4>Get ${c.discount}% Instant Discount</h4>
                <p>Applicable on all products. Minimum order value may apply.</p>
                <div class="coupon-code-box">
                  <span>${c.code}</span>
                  <button class="copy-btn" onclick="copyCode('${c.code}')">TAP TO COPY</button>
                </div>
              </div>
            </div>
          `;
        });
        grid.innerHTML = html;
      } catch(e) {
        document.getElementById("couponsGrid").innerHTML = "<p style='color:red; text-align:center;'>Error loading coupons.</p>";
      }
    }

    // ✅ Load Deal Products
    async function loadDeals() {
      try {
        const q = query(collection(db, "products"), where("isDeal", "==", true));
        const snap = await getDocs(q);
        const grid = document.getElementById("dealsGrid");
        
        if(snap.empty) {
          grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#777;'>No deals available right now. Please check back later!</p>";
          return;
        }

        let html = "";
        snap.forEach(d => {
          const p = d.data();
          const firstImg = p.image ? p.image.split(',')[0].trim() : 'https://placehold.co/400';
          const discount = p.originalPrice > p.price ? Math.round(((p.originalPrice - p.price) / p.originalPrice) * 100) : 0;
          const storeFile = p.store.toLowerCase();
          
          html += `
            <article class="deal-card">
              <div class="deal-img-wrap">
                <img src="${firstImg}" alt="${p.name}" onerror="this.src='https://placehold.co/400'">
                <span class="deal-tag">DEAL 🔥</span>
              </div>
              <h3>${p.name}</h3>
              <div class="deal-price">
                ₹${p.price} 
                <span>₹${p.originalPrice}</span>
                ${discount > 0 ? `<span class="discount-badge">${discount}% OFF</span>` : ''}
              </div>
              <a href="${storeFile}.html" class="btn-view-product">View Product ↗</a>
            </article>
          `;
        });
        grid.innerHTML = html;
      } catch(e) {
        document.getElementById("dealsGrid").innerHTML = "<p style='color:red; text-align:center;'>Error loading deals.</p>";
      }
    }

    // ✅ Copy to Clipboard Function
    window.copyCode = function(code) {
      navigator.clipboard.writeText(code).then(() => {
        // Change button text temporarily
        const btns = document.querySelectorAll('.copy-btn');
        btns.forEach(btn => {
          if(btn.getAttribute('onclick').includes(code)) {
            const original = btn.textContent;
            btn.textContent = "✓ COPIED";
            btn.style.color = "#047857";
            setTimeout(() => { btn.textContent = original; btn.style.color = "#10b981"; }, 2000);
          }
        });
        alert(`Coupon code "${code}" copied! You can apply this at checkout.`);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadCoupons();
      loadDeals();
    });
  </script>
</body>
</html>
