<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | Aaradhya Mart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .checkout-container { max-width: 600px; margin: 40px auto; padding: 30px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(16,36,59,0.05); }
    .form-group { margin-bottom: 15px; } .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 6px; }
    .form-group input, textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 6px; outline: none; }
    .payment-options { display: flex; gap: 15px; }
    .payment-option { flex: 1; border: 1px solid var(--line); padding: 15px; border-radius: 8px; text-align: center; font-size: 13px; font-weight: bold; cursor: pointer; }
    .payment-option input { display: none; }
    .payment-option:has(input:checked) { border-color: var(--navy); background: var(--cream); }
    
    /* Coupon Box Design */
    .coupon-box { display: flex; gap: 10px; margin-bottom: 15px; }
    .coupon-box input { flex: 1; padding: 10px; border: 1px solid var(--line); border-radius: 6px; text-transform: uppercase; }
    .coupon-box button { padding: 10px 20px; background: var(--navy); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .coupon-msg { font-size: 12px; font-weight: bold; margin-top: 5px; display: none; }
    
    .place-order-btn { width: 100%; padding: 16px; background: var(--navy); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 20px; }
  </style>
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">AM</span><span><strong>AARADHYA MART</strong><small>CHECKOUT</small></span></a></header>

  <main>
    <div class="checkout-container">
      <h2 style="text-align:center; font-family:Georgia;">Complete Your Order</h2>
      <div id="productSummary" style="background:var(--cream); padding:15px; border-radius:8px; margin-bottom:20px;">Loading...</div>

      <form id="checkoutForm">
        <div class="form-group"><label>Full Name *</label><input type="text" id="custName" required></div>
        <div class="form-group"><label>Mobile Number *</label><input type="tel" id="custPhone" required pattern="[0-9]{10}"></div>
        <div class="form-group"><label>Full Address *</label><textarea id="custAddress" required rows="2"></textarea></div>
        <div style="display:flex; gap:10px;">
          <div class="form-group" style="flex:1;"><label>City *</label><input type="text" id="custCity" required></div>
          <div class="form-group" style="flex:1;"><label>Pincode *</label><input type="text" id="custPincode" required pattern="[0-9]{6}"></div>
        </div>
        
        <div class="form-group"><label>Payment Mode *</label>
          <div class="payment-options">
            <label class="payment-option"><input type="radio" name="payment" value="COD" checked><span>💵 COD</span></label>
            <label class="payment-option"><input type="radio" name="payment" value="Online"><span>💳 Online</span></label>
          </div>
        </div>

        <!-- NAYA: Coupon Code Section -->
        <div style="background:#f4f6f8; padding:15px; border-radius:8px; border:1px dashed #ccc; margin-bottom:15px;">
          <label style="font-size:12px; font-weight:bold;">Have a Coupon Code?</label>
          <div class="coupon-box">
            <input type="text" id="couponCodeInput" placeholder="e.g. FIRST10">
            <button type="button" id="applyCouponBtn">APPLY</button>
          </div>
          <div id="couponMsg" class="coupon-msg"></div>
        </div>

        <!-- Total Amount Box -->
        <div style="background:var(--cream); padding:15px; border-radius:8px; text-align:right;">
          <p style="margin:0; font-size:14px;">Subtotal: ₹<span id="subTotalTxt">0</span></p>
          <p style="margin:5px 0 0; font-size:14px; color:#10b981; display:none;" id="discountTxtRow">Discount: -₹<span id="discountTxt">0</span></p>
          <h3 style="margin:10px 0 0; color:var(--navy);">Total Payable: ₹<span id="finalTotalTxt">0</span></h3>
        </div>

        <button type="submit" class="place-order-btn">CONFIRM ON WHATSAPP ↗</button>
      </form>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAffhI69b-piezGsdI5E1lUVcNj9nobG8Y", authDomain: "aaradhya-mart.firebaseapp.com", projectId: "aaradhya-mart", storageBucket: "aaradhya-mart.firebasestorage.app", messagingSenderId: "146782544824", appId: "1:146782544824:web:d605e1971d3480fab1654d" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    const WHATSAPP_NUMBER = "918931911428";
    
    let orderProducts = [], selectedStore = "Aaradhya Mart", isCartOrder = false;
    let currentSubtotal = 0, currentDiscount = 0, finalTotal = 0, appliedCoupon = "";

    document.addEventListener("DOMContentLoaded", async () => {
      // Load Cart or Single Product
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id'); const size = urlParams.get('size') || "N/A";
      selectedStore = urlParams.get('store') || "Aaradhya Mart";

      const snap = await getDocs(collection(db, "products"));
      const allProducts = []; snap.forEach(d => allProducts.push({ id: d.id, ...d.data() }));

      if (!productId) {
        isCartOrder = true; const cart = JSON.parse(localStorage.getItem("aaradhyaMartCart") || "[]");
        if (cart.length === 0) { alert("Cart empty!"); window.location.href = "index.html"; return; }
        
        document.getElementById("productSummary").innerHTML = cart.map(item => {
          const p = allProducts.find(x => x.id === item.id); if(!p) return "";
          orderProducts.push({ ...p, selectedSize: item.size, selectedQty: item.qty }); currentSubtotal += (p.price * item.qty);
          return `<div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;"><span>${p.name} (x${item.qty})</span> <span>₹${p.price * item.qty}</span></div>`;
        }).join("");
      } else {
        const p = allProducts.find(x => x.id === productId);
        orderProducts.push({ ...p, selectedSize: size, selectedQty: 1 }); currentSubtotal = p.price;
        document.getElementById("productSummary").innerHTML = `<div style="display:flex; justify-content:space-between; font-size:13px;"><span>${p.name} (${size})</span> <span>₹${p.price}</span></div>`;
      }
      
      updateTotals();
    });

    function updateTotals() {
      finalTotal = currentSubtotal - currentDiscount;
      document.getElementById("subTotalTxt").textContent = currentSubtotal;
      document.getElementById("finalTotalTxt").textContent = finalTotal;
      if(currentDiscount > 0) {
        document.getElementById("discountTxtRow").style.display = "block";
        document.getElementById("discountTxt").textContent = currentDiscount;
      }
    }

    // NAYA: Coupon Apply Logic
    document.getElementById("applyCouponBtn").onclick = async () => {
      const code = document.getElementById("couponCodeInput").value.trim().toUpperCase();
      const msg = document.getElementById("couponMsg");
      if(!code) return;

      const snap = await getDocs(collection(db, "coupons"));
      let found = false;
      snap.forEach(d => {
        if(d.data().code === code) {
          found = true;
          const pct = d.data().discount;
          currentDiscount = Math.round((currentSubtotal * pct) / 100);
          appliedCoupon = code;
          msg.style.display = "block"; msg.style.color = "#10b981"; msg.textContent = `✅ Coupon Applied! You saved ₹${currentDiscount}`;
          updateTotals();
        }
      });
      if(!found) { msg.style.display = "block"; msg.style.color = "#ef4444"; msg.textContent = "❌ Invalid or Expired Coupon."; currentDiscount = 0; updateTotals(); }
    }

    // Submit Order
    document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]'); btn.textContent = "Processing..."; btn.disabled = true;

      const newOrderId = "ORD-" + Date.now().toString().slice(-6);
      const name = custName.value, phone = custPhone.value, addr = custAddress.value + ", " + custCity.value + " - " + custPincode.value;
      
      try {
        await addDoc(collection(db, "orders"), {
          orderId: newOrderId, customerName: name, customerPhone: phone, address: addr, paymentMode: document.querySelector('input[name="payment"]:checked').value,
          store: selectedStore, items: orderProducts, totalAmount: finalTotal, discountApplied: currentDiscount, couponUsed: appliedCoupon, orderDate: new Date().toLocaleString("en-IN"), status: "Pending"
        });
        for (const item of orderProducts) { await updateDoc(doc(db, "products", item.id), { stock: increment(-item.selectedQty) }); }
      } catch(err) { alert("Order failed!"); btn.textContent = "CONFIRM"; btn.disabled = false; return; }

      const msg = `*NEW ORDER*\n*ID: ${newOrderId}*\nTotal: ₹${finalTotal} ${currentDiscount ? `(Coupon: ${appliedCoupon})` : ''}\nName: ${name}\nPhone: ${phone}\nAddress: ${addr}`;
      if(isCartOrder) localStorage.removeItem("aaradhyaMartCart");
      
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
      setTimeout(() => window.location.href = "index.html", 2000);
    });
  </script>
</body>
</html>
