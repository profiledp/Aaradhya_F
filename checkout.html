<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | Aaradhya Mart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .checkout-container { max-width: 600px; margin: 40px auto; padding: 30px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(16,36,59,0.05); }
    .checkout-container h2 { font: normal 28px Georgia, serif; color: var(--navy); margin-top: 0; margin-bottom: 20px; text-align: center; }
    .product-summary { background: var(--cream); padding: 15px; border-radius: 8px; margin-bottom: 25px; border: 1px solid var(--line); }
    .product-summary-info h4 { margin: 0 0 5px; font-size: 16px; color: var(--navy); font-family: Georgia, serif; }
    .product-summary-info p { margin: 0; font-size: 13px; color: var(--muted); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 6px; color: var(--ink); }
    .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 6px; font-family: inherit; font-size: 14px; outline: none; transition: 0.2s; box-sizing: border-box; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(16,36,59,0.1); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .payment-options { display: flex; gap: 15px; margin-top: 5px; }
    .payment-option { flex: 1; border: 1px solid var(--line); padding: 15px; border-radius: 8px; cursor: pointer; text-align: center; transition: 0.2s; font-size: 13px; font-weight: bold; display: block; }
    .payment-option input { display: none; }
    .payment-option input:checked + span { color: var(--navy); }
    .payment-option:has(input:checked) { border-color: var(--navy); background: var(--cream); }
    .place-order-btn { width: 100%; padding: 16px; background: var(--navy); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
    .share-loc-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .success-modal-overlay { position: fixed; inset: 0; background: rgba(16,36,59,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10000; opacity: 0; visibility: hidden; transition: 0.3s; }
    .success-modal-overlay.active { opacity: 1; visibility: visible; }
    .success-modal { background: #fff; padding: 40px; border-radius: 16px; text-align: center; max-width: 400px; transform: scale(0.8); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .success-modal-overlay.active .success-modal { transform: scale(1); }
    .success-modal h3 { color: var(--navy); font-family: Georgia, serif; font-size: 24px; margin: 0 0 10px; }
    @media(max-width:650px){.form-row{grid-template-columns:1fr}.payment-options{flex-direction:column}}
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">AM</span><span><strong>AARADHYA MART</strong><small>SECURE CHECKOUT</small></span></a>
    <a href="cart.html" class="header-wa" style="background:#fff; color:var(--navy); border:1px solid var(--navy);">← Back to Cart</a>
  </header>

  <main>
    <div class="checkout-container">
      <h2>Complete Your Order</h2>
      <div class="product-summary" id="productSummary">Loading...</div>

      <form id="checkoutForm">
        <div class="form-group"><label>Full Name *</label><input type="text" id="custName" required placeholder="Enter your full name"></div>
        <div class="form-group"><label>Mobile Number *</label><input type="tel" id="custPhone" required placeholder="10-digit mobile number" pattern="[0-9]{10}"></div>
        <div class="form-group">
          <label>Full Address *</label>
          <textarea id="custAddress" required placeholder="Enter your delivery address" rows="3"></textarea>
          <button type="button" class="share-loc-btn" onclick="shareLocationOnWhatsApp()">📍 Share Your Live Location</button>
        </div>
        <div class="form-group"><label>Google Maps Link (Optional)</label><input type="url" id="custMapLink" placeholder="Paste Google Maps location link here"></div>
        <div class="form-row">
          <div class="form-group"><label>City / Village *</label><input type="text" id="custCity" required placeholder="e.g. Azamgarh"></div>
          <div class="form-group"><label>Pincode *</label><input type="text" id="custPincode" required placeholder="6-digit pincode" pattern="[0-9]{6}"></div>
        </div>
        <div class="form-group">
          <label>Payment Mode *</label>
          <div class="payment-options">
            <label class="payment-option"><input type="radio" name="payment" value="COD" checked><span>💵 Cash on Delivery</span></label>
            <label class="payment-option"><input type="radio" name="payment" value="Online"><span>💳 Online Payment</span></label>
          </div>
        </div>
        <button type="submit" class="place-order-btn" id="submitBtn">CONFIRM & SEND ON WHATSAPP ↗</button>
      </form>
    </div>
  </main>

  <div class="success-modal-overlay" id="successModal">
    <div class="success-modal">
      <div style="font-size: 50px; margin-bottom: 15px;">✅</div>
      <h3>Order Placed!</h3>
      <p style="color:var(--muted); font-size:14px; margin-bottom:20px;">Your order has been sent to WhatsApp.</p>
      <button onclick="closeSuccessAndRedirect()" style="background:var(--navy); color:#fff; border:none; padding:12px 25px; border-radius:8px; font-weight:bold; cursor:pointer;">Go to Home</button>
    </div>
  </div>

  <script type="module">
    // NAYA: Import updateDoc & increment for stock minus
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAffhI69b-piezGsdI5E1lUVcNj9nobG8Y",
      authDomain: "aaradhya-mart.firebaseapp.com",
      projectId: "aaradhya-mart",
      storageBucket: "aaradhya-mart.firebasestorage.app",
      messagingSenderId: "146782544824",
      appId: "1:146782544824:web:d605e1971d3480fab1654d",
      measurementId: "G-L6VJBL7ESY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const WHATSAPP_NUMBER = "918931911428";
    let orderProducts = [], selectedStore = "Aaradhya Mart", isCartOrder = false;

    function saveAddressToLocal() {
      const data = { name: custName.value, phone: custPhone.value, address: custAddress.value, mapLink: custMapLink.value, city: custCity.value, pincode: custPincode.value };
      localStorage.setItem("aaradhyaCustomerDetails", JSON.stringify(data));
    }

    function loadAddressFromLocal() {
      try {
        const saved = localStorage.getItem("aaradhyaCustomerDetails");
        if(saved) {
          const data = JSON.parse(saved);
          custName.value = data.name || ""; custPhone.value = data.phone || ""; custAddress.value = data.address || "";
          custMapLink.value = data.mapLink || ""; custCity.value = data.city || ""; custPincode.value = data.pincode || "";
        }
      } catch(e) {}
    }

    window.shareLocationOnWhatsApp = function() { window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=Hello%20Aaradhya%20Mart,%20Here%20is%20my%20live%20location:`, "_blank"); }

    document.addEventListener("DOMContentLoaded", async () => {
      loadAddressFromLocal();
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id'); const size = urlParams.get('size') || "N/A";
      selectedStore = urlParams.get('store') || "Aaradhya Mart";

      const querySnapshot = await getDocs(collection(db, "products"));
      const allProducts = []; querySnapshot.forEach((doc) => allProducts.push({ id: doc.id, ...doc.data() }));

      if (!productId) {
        isCartOrder = true;
        const cart = JSON.parse(localStorage.getItem("aaradhyaMartCart") || "[]");
        if (cart.length === 0) { alert("Cart empty!"); window.location.href = "index.html"; return; }
        document.getElementById("productSummary").innerHTML = cart.map(item => {
          const p = allProducts.find(x => x.id === item.id); if(!p) return "";
          orderProducts.push({ ...p, selectedSize: item.size, selectedQty: item.qty });
          return `<div style="display:flex; gap:10px; align-items:center; margin-bottom:10px; border-bottom:1px solid #ddd; padding-bottom:10px;"><img src="${p.image}" style="width:50px; height:50px; object-fit:contain;"><div><h4 style="margin:0;">${p.name} (x${item.qty})</h4><p style="margin:0; font-size:12px;">Size: ${item.size} | ₹${p.price}</p></div></div>`;
        }).join("");
        selectedStore = "Multiple Stores (Cart)";
      } else {
        const p = allProducts.find(x => x.id === productId);
        if (!p) { alert("Product not found!"); window.location.href = "index.html"; return; }
        orderProducts.push({ ...p, selectedSize: size, selectedQty: 1 });
        document.getElementById("productSummary").innerHTML = `<div style="display:flex; gap:15px; align-items:center;"><img src="${p.image}" style="width:70px; height:70px; object-fit:contain;"><div class="product-summary-info"><h4>${p.name}</h4><p>Size: ${size} | ₹${p.price}</p></div></div>`;
      }

      document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.textContent = "Processing..."; submitBtn.disabled = true;
        saveAddressToLocal();

        const name = custName.value, phone = custPhone.value, address = custAddress.value, mapLink = custMapLink.value, city = custCity.value, pincode = custPincode.value;
        const payment = document.querySelector('input[name="payment"]:checked').value;
        let productDetailsText = "", totalAmount = 0, itemsArray = [];

        orderProducts.forEach(item => {
          productDetailsText += `- ${item.name} (Qty: ${item.selectedQty}, Size: ${item.selectedSize}) = ₹${item.price * item.selectedQty}\n`;
          totalAmount += (item.price * item.selectedQty);
          itemsArray.push({ name: item.name, qty: item.selectedQty, size: item.selectedSize, price: item.price, id: item.id });
        });

        try {
          // 1. Save Order
          await addDoc(collection(db, "orders"), {
            orderId: "ORD-" + Date.now().toString().slice(-6), customerName: name, customerPhone: phone, address: address + ", " + city + " - " + pincode, mapLink: mapLink || "Not Provided", paymentMode: payment, store: selectedStore, items: itemsArray, totalAmount: totalAmount, orderDate: new Date().toLocaleString("en-IN"), status: "Pending"
          });

          // 2. NAYA: MINUS STOCK AUTOMATICALLY
          for (const item of orderProducts) {
             const productRef = doc(db, "products", item.id);
             await updateDoc(productRef, { stock: increment(-item.selectedQty) });
          }

        } catch (error) {
          console.error("Error:", error); alert("Order failed. Try again."); submitBtn.textContent = "CONFIRM & SEND ON WHATSAPP ↗"; submitBtn.disabled = false; return;
        }

        // 3. Send WhatsApp
        const locationText = mapLink ? `\n*Map Link:* ${mapLink}\n` : "";
        const msg = `*NEW ORDER - ${selectedStore}*\n\n*Products:*\n${productDetailsText}\n*Total: ₹${totalAmount}*\n\n*Customer:* ${name}\n*Phone:* ${phone}\n*Address:* ${address}, ${city} - ${pincode}\n${locationText}\n*Payment:* ${payment}`;
        if(isCartOrder) localStorage.removeItem("aaradhyaMartCart");
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
        
        document.getElementById("successModal").classList.add("active");
        submitBtn.textContent = "CONFIRM & SEND ON WHATSAPP ↗"; submitBtn.disabled = false;
      });
    });
    window.closeSuccessAndRedirect = function() { document.getElementById("successModal").classList.remove("active"); setTimeout(() => window.location.href = "index.html", 300); }
  </script>
</body>
</html>
