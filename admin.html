<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard | Aaradhya Mart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #f4f6f8; margin: 0; font-family: Arial, sans-serif; }
    .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
    .login-card input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .admin-shell { max-width: 1200px; margin: 40px auto; padding: 20px; }
    .admin-panel { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
    .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-field label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; }
    .form-field input, .form-field select, .form-field textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .form-field.full { grid-column: 1 / -1; }
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .admin-table th, .admin-table td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; font-size: 13px; }
    .stock-input { width: 70px; padding: 5px; text-align: center; }
    .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-primary { background: #10243b; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-success { background: #10b981; color: #fff; }
    .hidden { display: none !important; }
    
    .filter-tabs { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .filter-btn { padding: 8px 15px; border: 1px solid #ccc; background: #fff; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .filter-btn.active { background: #10243b; color: #fff; border-color: #10243b; }

    /* Tabs for Product / Orders */
    .main-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ccc; padding-bottom: 10px;}
    .main-tab-btn { background: none; border: none; font-size: 18px; font-weight: bold; color: #777; cursor: pointer; padding: 10px;}
    .main-tab-btn.active { color: #10243b; border-bottom: 3px solid #10243b;}
    
    .order-card { border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #fafafa; }
    .order-card h4 { margin: 0 0 10px; color: #10243b; }
    .order-card p { margin: 5px 0; font-size: 13px; }
  </style>
</head>
<body>
  <div id="loginView" class="login-wrapper">
    <div class="login-card">
      <h2>Admin Login</h2>
      <input id="adminEmail" type="email" placeholder="Email" required>
      <input id="adminPass" type="password" placeholder="Password" required>
      <button class="btn btn-primary" id="loginButton" style="width:100%;">LOGIN</button>
      <p id="loginError" style="color:red; font-size:12px; margin-top:10px;"></p>
    </div>
  </div>

  <div id="adminView" class="admin-shell hidden">
    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
      <h1>Stock Manager (Cloud)</h1>
      <button class="btn btn-danger" id="logoutButton">LOG OUT</button>
    </div>

    <!-- MAIN TABS -->
    <div class="main-tabs">
      <button class="main-tab-btn active" onclick="switchMainTab('products', this)">🛍️ Manage Products</button>
      <button class="main-tab-btn" onclick="switchMainTab('orders', this)">📦 View Orders</button>
    </div>

    <!-- ================= PRODUCTS SECTION ================= -->
    <div id="productsSection">
      <div class="admin-panel">
        <h2 id="formTitle">Add New Product</h2>
        <form id="productForm">
          <input type="hidden" id="editId">
          <div class="grid-form">
            <div class="form-field"><label>Store</label>
              <select id="pStore">
                <option value="Fashion">Fashion</option>
                <option value="Print">Print</option>
                <option value="Kirana">Kirana</option>
              </select>
            </div>
            <div class="form-field"><label>Product Name</label><input id="pName" required></div>
            <div class="form-field"><label>Category</label><input id="pCategory" required placeholder="e.g. Men, Grocery"></div>
            <div class="form-field"><label>Price (₹)</label><input id="pPrice" type="number" required></div>
            <div class="form-field"><label>Original Price (₹)</label><input id="pOriginal" type="number"></div>
            
            <div class="form-field">
              <label>Unit (KG, Gram, Packet, Pieces)</label>
              <input id="pUnit" placeholder="e.g. 1kg, 500g, 1 Packet">
            </div>

            <div class="form-field"><label>Stock Quantity</label><input id="pStock" type="number" required value="10"></div>
            <div class="form-field full"><label>Image URL</label><input id="pImage" required placeholder="https://..."></div>
            
            <div class="form-field"><label>Sizes (Comma Separated)</label><input id="pSizes" placeholder="M, L, XL (for Fashion) OR 250G, 500G (for Kirana)"></div>
            <div class="form-field"><label>Tag</label><input id="pTag" placeholder="NEW / POPULAR"></div>
            <div class="form-field full"><label>Description</label><textarea id="pDescription"></textarea></div>
          </div>
          <div style="margin-top: 15px;">
            <button type="submit" class="btn btn-primary">SAVE PRODUCT</button>
          </div>
        </form>
      </div>

      <div class="admin-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2>All Products (Live)</h2>
          
          <div class="filter-tabs">
            <button class="filter-btn active" onclick="filterTable('All', this)">All</button>
            <button class="filter-btn" onclick="filterTable('Fashion', this)">Fashion</button>
            <button class="filter-btn" onclick="filterTable('Print', this)">Print</button>
            <button class="filter-btn" onclick="filterTable('Kirana', this)">Kirana</button>
          </div>
        </div>

        <table class="admin-table">
          <thead><tr><th>Store</th><th>Name</th><th>Unit</th><th>Price</th><th>Quick Stock</th><th>Actions</th></tr></thead>
          <tbody id="productRows"></tbody>
        </table>
      </div>
    </div>

    <!-- ================= ORDERS SECTION ================= -->
    <div id="ordersSection" class="hidden">
      <div class="admin-panel">
        <h2>All Orders (Live)</h2>
        <div id="ordersList">
          <!-- Orders will be injected here -->
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAffhI69b-piezGsdI5E1lUVcNj9nobG8Y",
      authDomain: "aaradhya-mart.firebaseapp.com",
      projectId: "aaradhya-mart",
      storageBucket: "aaradhya-mart.firebasestorage.app",
      messagingSenderId: "146782544824",
      appId: "1:146782544824:web:d605e1971d3480fab1654d",
      measurementId: "G-L6VJBL7ESY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let allProducts = [];
    let currentFilter = "All";

    // Main Tab Switch
    window.switchMainTab = function(tabName, btnElement) {
      document.querySelectorAll('.main-tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      if(tabName === 'products') {
        document.getElementById("productsSection").classList.remove("hidden");
        document.getElementById("ordersSection").classList.add("hidden");
        loadProducts();
      } else {
        document.getElementById("productsSection").classList.add("hidden");
        document.getElementById("ordersSection").classList.remove("hidden");
        loadOrders();
      }
    }

    // === PRODUCT FUNCTIONS ===
    async function loadProducts() {
      const querySnapshot = await getDocs(collection(db, "products"));
      allProducts = [];
      querySnapshot.forEach((doc) => allProducts.push({ id: doc.id, ...doc.data() }));
      renderTable();
    }

    window.filterTable = function(storeName, btnElement) {
      currentFilter = storeName;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      renderTable();
    }

    function renderTable() {
      let filteredProducts = allProducts;
      if (currentFilter !== "All") {
        filteredProducts = allProducts.filter(p => p.store === currentFilter);
      }

      document.getElementById("productRows").innerHTML = filteredProducts.map(p => `
        <tr>
          <td><span class="badge">${p.store}</span></td>
          <td>${p.name}</td>
          <td>${p.unit || '-'}</td>
          <td>₹${p.price}</td>
          <td><input type="number" class="stock-input" value="${p.stock}" data-stock-id="${p.id}"></td>
          <td>
            <button class="btn btn-primary" style="padding:5px 10px; font-size:11px;" data-edit="${p.id}">Edit</button>
            <button class="btn btn-danger" style="padding:5px 10px; font-size:11px;" data-delete="${p.id}">Delete</button>
          </td>
        </tr>
      `).join("");
    }

    // === ORDER FUNCTIONS ===
    async function loadOrders() {
      const ordersList = document.getElementById("ordersList");
      ordersList.innerHTML = "<p>Loading orders...</p>";

      try {
        const q = query(collection(db, "orders"), orderBy("orderDate", "desc"));
        const querySnapshot = await getDocs(q);
        
        let ordersHtml = "";
        if(querySnapshot.empty) {
          ordersHtml = "<p>No orders found yet.</p>";
        } else {
          querySnapshot.forEach((doc) => {
            const o = doc.data();
            const itemsStr = o.items.map(i => `${i.name} (x${i.qty}, ${i.size})`).join(", ");
            ordersHtml += `
              <div class="order-card">
                <h4>${o.orderId} <span style="font-size:12px; color:#10b981;">(${o.status})</span></h4>
                <p><strong>Date:</strong> ${o.orderDate}</p>
                <p><strong>Name:</strong> ${o.customerName} | <strong>Phone:</strong> ${o.customerPhone}</p>
                <p><strong>Address:</strong> ${o.address}</p>
                <p><strong>Products:</strong> ${itemsStr}</p>
                <p><strong>Total:</strong> ₹${o.totalAmount} | <strong>Payment:</strong> ${o.paymentMode}</p>
                <a href="${o.mapLink}" target="_blank" style="color:#0369a1; font-size:12px;">View Google Map Location</a>
              </div>
            `;
          });
        }
        ordersList.innerHTML = ordersHtml;
      } catch (e) {
        ordersList.innerHTML = "<p>Error loading orders. Make sure Firebase Index is created if you used orderBy.</p>";
      }
    }

    // === AUTH & LOGIN ===
    document.getElementById("loginButton").onclick = async () => {
      try {
        await signInWithEmailAndPassword(auth, document.getElementById("adminEmail").value, document.getElementById("adminPass").value);
      } catch (e) { document.getElementById("loginError").textContent = "Login failed: " + e.message; }
    };

    document.getElementById("logoutButton").onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("loginView").style.display = "none";
        document.getElementById("adminView").classList.remove("hidden");
        loadProducts(); // Default load
      } else {
        document.getElementById("loginView").style.display = "flex";
        document.getElementById("adminView").classList.add("hidden");
      }
    });

    // === ADD/EDIT/DELETE PRODUCT ===
    document.getElementById("productForm").onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById("editId").value || "P" + Date.now();
      const productData = {
        store: document.getElementById("pStore").value,
        name: document.getElementById("pName").value,
        category: document.getElementById("pCategory").value,
        price: Number(document.getElementById("pPrice").value),
        originalPrice: Number(document.getElementById("pOriginal").value) || 0,
        unit: document.getElementById("pUnit").value,
        stock: Number(document.getElementById("pStock").value),
        image: document.getElementById("pImage").value,
        sizes: document.getElementById("pSizes").value.split(",").map(s=>s.trim()).filter(Boolean),
        tag: document.getElementById("pTag").value,
        description: document.getElementById("pDescription").value
      };
      await setDoc(doc(db, "products", id), productData);
      document.getElementById("productForm").reset();
      document.getElementById("editId").value = "";
      loadProducts();
      alert("Product Saved to Cloud!");
    };

    document.getElementById("productRows").addEventListener("change", async (e) => {
      if(e.target.hasAttribute("data-stock-id")) {
        await updateDoc(doc(db, "products", e.target.dataset.stockId), { stock: Number(e.target.value) });
        e.target.style.background = "#d4edda"; setTimeout(() => e.target.style.background = "", 1000);
      }
    });

    document.getElementById("productRows").addEventListener("click", async (e) => {
      const editId = e.target.dataset.edit;
      const delId = e.target.dataset.delete;
      if(editId) {
        const p = allProducts.find(x => x.id === editId);
        document.getElementById("editId").value = p.id;
        document.getElementById("pStore").value = p.store;
        document.getElementById("pName").value = p.name;
        document.getElementById("pCategory").value = p.category;
        document.getElementById("pPrice").value = p.price;
        document.getElementById("pOriginal").value = p.originalPrice;
        document.getElementById("pUnit").value = p.unit || "";
        document.getElementById("pStock").value = p.stock;
        document.getElementById("pImage").value = p.image;
        document.getElementById("pSizes").value = (p.sizes||[]).join(", ");
        document.getElementById("pTag").value = p.tag || "";
        document.getElementById("pDescription").value = p.description || "";
        document.getElementById("formTitle").textContent = "Edit Product";
        window.scrollTo(0,0);
      }
      if(delId && confirm("Delete this product?")) {
        await deleteDoc(doc(db, "products", delId));
        loadProducts();
      }
    });
  </script>
</body>
</html>
