<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard | Aaradhya Mart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #f4f6f8; margin: 0; font-family: Arial, sans-serif; }
    .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
    .login-card input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .admin-shell { max-width: 1200px; margin: 40px auto; padding: 20px; }
    .admin-panel { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
    .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-field label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; }
    .form-field input, .form-field select, .form-field textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .form-field.full { grid-column: 1 / -1; }
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .admin-table th, .admin-table td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; font-size: 13px; }
    .stock-input { width: 70px; padding: 5px; text-align: center; border: 1px solid #ccc; border-radius: 4px;}
    .stock-low { border: 2px solid #ef4444 !important; background: #fee2e2 !important; color: #b91c1c; font-weight: bold; }
    .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-primary { background: #10243b; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .filter-tabs { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .filter-btn { padding: 8px 15px; border: 1px solid #ccc; background: #fff; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .filter-btn.active { background: #10243b; color: #fff; border-color: #10243b; }
    .main-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ccc; padding-bottom: 10px;}
    .main-tab-btn { background: none; border: none; font-size: 16px; font-weight: bold; color: #777; cursor: pointer; padding: 10px;}
    .main-tab-btn.active { color: #10243b; border-bottom: 3px solid #10243b;}
    .order-card { border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #fafafa; }
    .order-card h4 { margin: 0 0 10px; color: #10243b; display:flex; justify-content:space-between; align-items:center;}
    .status-select { padding: 6px 10px; border-radius: 20px; font-weight: bold; border: 1px solid #ccc; cursor: pointer; outline: none; font-size: 12px; }
    .status-Pending { background: #fef3c7; color: #92400e; }
    .status-Delivered { background: #dcfce7; color: #166534; }
    .status-Cancelled { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div id="loginView" class="login-wrapper">
    <div class="login-card">
      <h2>Admin Login</h2>
      <input id="adminEmail" type="email" placeholder="Email" required>
      <input id="adminPass" type="password" placeholder="Password" required>
      <button class="btn btn-primary" id="loginButton" style="width:100%;">LOGIN</button>
      <p id="loginError" style="color:red; font-size:12px; margin-top:10px;"></p>
    </div>
  </div>

  <div id="adminView" class="admin-shell hidden">
    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
      <h1>Stock Manager</h1>
      <button class="btn btn-danger" id="logoutButton">LOG OUT</button>
    </div>

    <div class="main-tabs">
      <button class="main-tab-btn active" onclick="switchMainTab('products', this)">🛍️ Products</button>
      <button class="main-tab-btn" onclick="switchMainTab('orders', this)">📦 Orders</button>
      <button class="main-tab-btn" onclick="switchMainTab('coupons', this)">🎟️ Coupons</button>
    </div>

    <!-- PRODUCTS SECTION -->
    <div id="tab-products" class="tab-content active">
      <div class="admin-panel">
        <h2 id="formTitle">Add New Product</h2>
        <form id="productForm">
          <input type="hidden" id="editId">
          <div class="grid-form">
            <div class="form-field"><label>Store</label><select id="pStore"><option value="Fashion">Fashion</option><option value="Print">Print</option><option value="Kirana">Kirana</option></select></div>
            <div class="form-field"><label>Product Name</label><input id="pName" required></div>
            <div class="form-field"><label>Category</label><input id="pCategory" required></div>
            <div class="form-field"><label>Price (₹)</label><input id="pPrice" type="number" required></div>
            <div class="form-field"><label>Original Price (₹)</label><input id="pOriginal" type="number"></div>
            <div class="form-field"><label>Unit</label><input id="pUnit" placeholder="e.g. 1kg, 500g"></div>
            <div class="form-field"><label>Stock</label><input id="pStock" type="number" required value="10"></div>
            <div class="form-field full"><label>Image URL (Comma separated for multiple photos)</label><input id="pImage" required placeholder="url1, url2"></div>
            <div class="form-field"><label>Sizes</label><input id="pSizes" placeholder="M, L, XL"></div>
            <div class="form-field"><label>Tag</label><input id="pTag" placeholder="NEW"></div>
            <div class="form-field full"><label style="display:flex; align-items:center; gap:10px; cursor:pointer; background:#fff3cd; padding:10px; border-radius:6px;"><input type="checkbox" id="pIsDeal" style="width:18px; height:18px; margin:0;"><span style="color:#856404;">🔥 Deal of the Day</span></label></div>
            <div class="form-field full"><label>Description</label><textarea id="pDescription"></textarea></div>
          </div>
          <div style="margin-top: 15px;">
            <button type="submit" class="btn btn-primary">SAVE PRODUCT</button>
            <button type="button" class="btn" id="clearBtn" style="background:#eee;">CLEAR FORM</button>
          </div>
        </form>
      </div>

      <div class="admin-panel">
        <h2>All Products</h2>
        <table class="admin-table">
          <thead><tr><th>Store</th><th>Name</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
          <tbody id="productRows"></tbody>
        </table>
      </div>
    </div>

    <!-- ORDERS SECTION -->
    <div id="tab-orders" class="tab-content">
      <div class="admin-panel"><h2>All Orders (Live)</h2><div id="ordersList"></div></div>
    </div>

    <!-- COUPONS SECTION -->
    <div id="tab-coupons" class="tab-content">
      <div class="admin-panel">
        <h2>Create New Coupon</h2>
        <form id="couponForm" class="grid-form">
          <div class="form-field"><label>Coupon Code (e.g. FIRST10)</label><input id="cCode" required style="text-transform:uppercase;"></div>
          <div class="form-field"><label>Discount % (e.g. 10)</label><input id="cDiscount" type="number" required min="1" max="100"></div>
          <div class="form-field full"><button type="submit" class="btn btn-primary">CREATE COUPON</button></div>
        </form>
      </div>
      <div class="admin-panel">
        <h2>Active Coupons</h2>
        <table class="admin-table">
          <thead><tr><th>Code</th><th>Discount</th><th>Action</th></tr></thead>
          <tbody id="couponRows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- CUSTOM POPUP FOR DELETE CONFIRMATION -->
  <div class="custom-modal-overlay" id="deleteModal">
    <div class="custom-modal">
      <div style="font-size: 40px; margin-bottom: 15px; color: #ef4444;">⚠️</div>
      <h3 id="deleteTitle">Delete Item?</h3>
      <p>Are you sure you want to delete this? This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="modal-btn btn-cancel" onclick="closeDeleteModal()">Cancel</button>
        <button class="modal-btn btn-danger" id="confirmDeleteBtn">Yes, Delete</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyAffhI69b-piezGsdI5E1lUVcNj9nobG8Y", authDomain: "aaradhya-mart.firebaseapp.com", projectId: "aaradhya-mart", storageBucket: "aaradhya-mart.firebasestorage.app", messagingSenderId: "146782544824", appId: "1:146782544824:web:d605e1971d3480fab1654d" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);
    let allProducts = [];

    window.switchMainTab = function(tabName, btnElement) {
      document.querySelectorAll('.main-tab-btn').forEach(btn => btn.classList.remove('active')); btnElement.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      if(tabName === 'products') loadProducts(); else if(tabName === 'orders') loadOrders(); else if(tabName === 'coupons') loadCoupons();
    }

    async function loadProducts() {
      const snap = await getDocs(collection(db, "products")); allProducts = [];
      snap.forEach(d => allProducts.push({ id: d.id, ...d.data() }));
      document.getElementById("productRows").innerHTML = allProducts.map(p => `
        <tr>
          <td>${p.store}</td><td>${p.name}</td><td>₹${p.price}</td>
          <td><input type="number" class="stock-input ${p.stock <= 5 ? 'stock-low' : ''}" value="${p.stock}" data-stock-id="${p.id}"></td>
          <td>
            <button class="btn btn-primary" style="padding:5px 10px; font-size:11px;" data-edit="${p.id}">Edit</button>
            <button class="btn btn-danger" style="padding:5px 10px; font-size:11px;" onclick="openDeleteModal('product', '${p.id}')">Delete</button>
          </td>
        </tr>
      `).join("");
      
      document.querySelectorAll("[data-stock-id]").forEach(input => {
        input.addEventListener("change", async (e) => {
          await updateDoc(doc(db, "products", e.target.dataset.stockId), { stock: Number(e.target.value) });
          e.target.style.background = "#d4edda"; setTimeout(() => e.target.style.background = "", 1000);
        });
      });

      document.querySelectorAll("[data-edit]").forEach(btn => {
        btn.addEventListener("click", () => {
          const p = allProducts.find(x => x.id === btn.dataset.edit);
          editId.value = p.id; pStore.value = p.store; pName.value = p.name; pCategory.value = p.category; pPrice.value = p.price; pOriginal.value = p.originalPrice; pUnit.value = p.unit || ""; pStock.value = p.stock; pImage.value = p.image; pSizes.value = (p.sizes||[]).join(", "); pTag.value = p.tag || ""; document.getElementById("pIsDeal").checked = p.isDeal || false; pDescription.value = p.description || "";
          formTitle.textContent = "Edit Product"; window.scrollTo(0,0);
        });
      });
    }

    document.getElementById("productForm").onsubmit = async (e) => {
      e.preventDefault(); const id = editId.value || "P" + Date.now();
      await setDoc(doc(db, "products", id), {
        store: pStore.value, name: pName.value, category: pCategory.value, price: Number(pPrice.value), originalPrice: Number(pOriginal.value)||0, unit: pUnit.value, stock: Number(pStock.value), image: pImage.value, sizes: pSizes.value.split(",").map(s=>s.trim()).filter(Boolean), tag: pTag.value, isDeal: document.getElementById("pIsDeal").checked, description: pDescription.value
      });
      productForm.reset(); editId.value = ""; document.getElementById("pIsDeal").checked = false; loadProducts(); showToast("Product Saved!");
    };
    document.getElementById("clearBtn").onclick = () => { productForm.reset(); editId.value=""; formTitle.textContent="Add New Product"; };

    async function loadOrders() {
      const ordersList = document.getElementById("ordersList"); ordersList.innerHTML = "<p>Loading...</p>";
      try {
        const q = query(collection(db, "orders"), orderBy("orderDate", "desc")); const snap = await getDocs(q);
        if(snap.empty) { ordersList.innerHTML = "<p>No orders found.</p>"; return; }
        ordersList.innerHTML = snap.docs.map(d => {
          const o = d.data(); const itemsStr = o.items.map(i => `${i.name} (x${i.qty})`).join("<br>");
          const statusClass = `status-${o.status.replace(/\s+/g, '')}`;
          return `
            <div class="order-card">
              <h4><span>${o.orderId} - ${o.customerName}</span>
              <select class="status-select ${statusClass}" onchange="updateOrder('${d.id}', this.value, this)">
                <option value="Pending" ${o.status==='Pending'?'selected':''}>Pending</option>
                <option value="Delivered" ${o.status==='Delivered'?'selected':''}>Delivered</option>
                <option value="Cancelled" ${o.status==='Cancelled'?'selected':''}>Cancelled</option>
              </select></h4>
              <p><strong>Date:</strong> ${o.orderDate}</p>
              <p><strong>Phone:</strong> <a href="https://wa.me/91${o.customerPhone}" target="_blank" style="color:#10b981;">${o.customerPhone}</a></p>
              <p><strong>Address:</strong> ${o.address}</p>
              <p><strong>Products:</strong><br> ${itemsStr}</p>
              <p><strong>Total:</strong> ₹${o.totalAmount} | <strong>Payment:</strong> ${o.paymentMode}</p>
            </div>`;
        }).join("");
      } catch(e) { ordersList.innerHTML = "Error loading orders."; }
    }
    window.updateOrder = async (id, val, sel) => { await updateDoc(doc(db, "orders", id), { status: val }); sel.className = `status-select status-${val}`; };

    async function loadCoupons() {
      const snap = await getDocs(collection(db, "coupons"));
      document.getElementById("couponRows").innerHTML = snap.docs.map(d => {
        const c = d.data();
        return `<tr><td><b>${c.code}</b></td><td>${c.discount}%</td><td><button class="btn btn-danger" style="padding:5px 10px; font-size:11px;" onclick="openDeleteModal('coupon', '${d.id}')">Delete</button></td></tr>`;
      }).join("");
    }
    document.getElementById("couponForm").onsubmit = async (e) => {
      e.preventDefault(); const code = document.getElementById("cCode").value.toUpperCase();
      await setDoc(doc(db, "coupons", code), { code: code, discount: Number(document.getElementById("cDiscount").value) });
      showToast("Coupon Created!"); document.getElementById("couponForm").reset(); loadCoupons();
    }

    // CUSTOM DELETE MODAL LOGIC
    let deleteItemType = ""; let deleteItemId = "";
    window.openDeleteModal = function(type, id) {
      deleteItemType = type; deleteItemId = id;
      document.getElementById("deleteTitle").textContent = type === 'product' ? "Delete Product?" : "Delete Coupon?";
      document.getElementById("deleteModal").classList.add("active");
    }
    window.closeDeleteModal = function() { document.getElementById("deleteModal").classList.remove("active"); }
    document.getElementById("confirmDeleteBtn").onclick = async () => {
      if(deleteItemType === 'product') { await deleteDoc(doc(db, "products", deleteItemId)); loadProducts(); }
      else if(deleteItemType === 'coupon') { await deleteDoc(doc(db, "coupons", deleteItemId)); loadCoupons(); }
      closeDeleteModal(); showToast("Deleted Successfully!");
    }

    function showToast(msg) {
      let t = document.querySelector('.toast-notification'); if(t) t.remove();
      const toast = document.createElement('div'); toast.className='toast-notification'; toast.innerHTML = `<span class="toast-icon">✅</span> ${msg}`;
      document.body.appendChild(toast); setTimeout(()=>toast.classList.add('show'),10);
      setTimeout(()=>{toast.classList.remove('show'); setTimeout(()=>toast.remove(),400);},3000);
    }

    document.getElementById("loginButton").onclick = async () => { try { await signInWithEmailAndPassword(auth, adminEmail.value, adminPass.value); } catch (e) { loginError.textContent = e.message; } };
    document.getElementById("logoutButton").onclick = () => signOut(auth);
    onAuthStateChanged(auth, (u) => { if(u) { loginView.style.display="none"; adminView.classList.remove("hidden"); loadProducts(); } else { loginView.style.display="flex"; adminView.classList.add("hidden"); } });
  </script>
</body>
</html>
