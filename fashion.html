<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aaradhya Fashion | Clothing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">AM</span><span><strong>AARADHYA FASHION</strong><small>BY AARADHYA MART</small></span></a>
    <a href="index.html" class="header-wa" style="background:#fff; color:var(--navy); border:1px solid var(--navy);">← Back to Home</a>
  </header>

  <main class="section-wrap shop-section" style="padding-top: 40px;">
    <div class="section-heading" style="margin-bottom: 20px;">
      <span class="eyebrow">CLOTHING & APPAREL</span>
      <h2>Fashion Collection</h2>
    </div>

    <div class="shop-controls">
      <label class="search-field"><span>⌕</span><input id="searchInput" type="search" placeholder="Search clothes..." autocomplete="off"></label>
      <select id="categoryFilter"><option value="All">All Categories</option></select>
      <select id="sortFilter"><option value="featured">Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option></select>
    </div>

    <div class="product-grid" id="productGrid"></div>
    <div class="empty-state hidden" id="emptyState"><span>✧</span><h3>No products found</h3><p>Try another search or category.</p></div>
  </main>

  <dialog class="product-dialog" id="productDialog">
    <button class="dialog-close" id="dialogClose">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <script src="products.js"></script>
  <script>
    const PAGE_STORE = "Fashion";
    let products = [];

    function load() {
      const saved = localStorage.getItem("aaradhyaMartProductsV1");
      products = saved ? JSON.parse(saved) : window.STARTER_PRODUCTS;
    }
    function money(v) { return "₹" + Number(v||0).toLocaleString("en-IN"); }
    
    function render() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const cat = document.getElementById("categoryFilter").value;
      const sort = document.getElementById("sortFilter").value;
      
      let list = products.filter(p => p.store === PAGE_STORE);
      if (cat !== "All") list = list.filter(p => p.category === cat);
      list = list.filter(p => [p.name, p.category].join(" ").toLowerCase().includes(query));
      if (sort === "low") list.sort((a,b)=>a.price-b.price);
      if (sort === "high") list.sort((a,b)=>b.price-a.price);

      const grid = document.getElementById("productGrid");
      const emptyState = document.getElementById("emptyState");

      if (list.length === 0) {
        grid.innerHTML = ""; emptyState.classList.remove("hidden");
      } else {
        emptyState.classList.add("hidden");
        grid.innerHTML = list.map(p => {
          const isOut = p.stock <= 0;
          return `
          <article class="product-card">
            <div class="product-image-wrap" data-open="${p.id}">
              <img src="${p.image}" alt="${p.name}">
              ${p.tag ? `<span class="product-tag">${p.tag}</span>` : ""}
            </div>
            <div class="product-info">
              <span class="product-category">${p.category}</span>
              <h3>${p.name}</h3>
              <div class="product-price">${money(p.price)} ${p.originalPrice>p.price ? `<span class="old-price">${money(p.originalPrice)}</span>`:""}</div>
              <div class="product-actions">
                <button class="small-button" data-open="${p.id}">VIEW</button>
                <button class="small-button primary" data-order="${p.id}" ${isOut?'disabled':''}>${isOut?'OUT OF STOCK':'ORDER ↗'}</button>
              </div>
            </div>
          </article>`;
        }).join("");
      }
    }

    function openProduct(id) {
      const p = products.find(x => x.id === id);
      const d = document.getElementById("productDialog");
      document.getElementById("dialogContent").innerHTML = `
        <div class="dialog-layout">
          <img src="${p.image}" alt="${p.name}">
          <div class="dialog-details">
            <h2>${p.name}</h2>
            <div class="product-price">${money(p.price)}</div>
            <p>${p.description}</p>
            <label>Size:</label>
            <select id="sizeChoice">${p.sizes.map(s=>`<option>${s}</option>`).join("")}</select>
            <button class="button-navy" id="dialogOrder">PROCEED TO CHECKOUT ↗</button>
          </div>
        </div>`;
      d.showModal();
      document.getElementById("dialogOrder").onclick = () => {
        const size = document.getElementById("sizeChoice").value;
        window.location.href = `checkout.html?id=${p.id}&size=${encodeURIComponent(size)}&store=Aaradhya Fashion`;
      };
    }

    document.addEventListener("DOMContentLoaded", () => {
      load();
      const catSelect = document.getElementById("categoryFilter");
      const cats = [...new Set(products.filter(p => p.store === PAGE_STORE).map(p => p.category))];
      cats.forEach(c => catSelect.innerHTML += `<option value="${c}">${c}</option>`);

      const urlParams = new URLSearchParams(window.location.search);
      const urlCat = urlParams.get('category');
      if (urlCat && cats.includes(urlCat)) catSelect.value = urlCat;

      render();
      
      document.getElementById("searchInput").addEventListener("input", render);
      document.getElementById("categoryFilter").addEventListener("change", render);
      document.getElementById("sortFilter").addEventListener("change", render);
      
      document.getElementById("productGrid").addEventListener("click", e => {
        const open = e.target.closest("[data-open]");
        const order = e.target.closest("[data-order]");
        if(open) openProduct(open.dataset.open);
        if(order && !order.disabled) {
          const p = products.find(x=>x.id===order.dataset.order);
          window.location.href = `checkout.html?id=${p.id}&size=N/A&store=Aaradhya Fashion`;
        }
      });
      document.getElementById("dialogClose").onclick = () => document.getElementById("productDialog").close();
    });
  </script>
</body>
</html>
