<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aaradhya Fashion | Clothing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-mark">AM</span>
      <span><strong>AARADHYA FASHION</strong><small>BY AARADHYA MART</small></span>
    </a>
    <a href="index.html" class="header-wa" style="background:#fff; color:var(--navy); border:1px solid var(--navy);">← Back to Home</a>
  </header>

  <main class="section-wrap shop-section" style="padding-top: 40px;">
    <div class="section-heading" style="margin-bottom: 20px;">
      <span class="eyebrow">CLOTHING & APPAREL</span>
      <h2>Fashion Collection</h2>
    </div>

    <!-- Filters -->
    <div class="shop-controls">
      <label class="search-field">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Search clothes..." autocomplete="off">
      </label>
      <select id="categoryFilter">
        <option value="All">All Categories</option>
      </select>
      <select id="sortFilter">
        <option value="featured">Featured</option>
        <option value="low">Price: Low to High</option>
        <option value="high">Price: High to Low</option>
      </select>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="productGrid"></div>
    
    <!-- Empty State -->
    <div class="empty-state hidden" id="emptyState">
      <span>✧</span>
      <h3>No products found</h3>
      <p>Try another search or category.</p>
    </div>
  </main>

  <!-- Product Detail Dialog -->
  <dialog class="product-dialog" id="productDialog">
    <button class="dialog-close" id="dialogClose">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <script src="products.js"></script>
  <script>
    const PAGE_STORE = "Fashion";
    const WHATSAPP_NUMBER = "918931911428";
    let products = [];

    // Load products from LocalStorage or Starter Data
    function load() {
      const saved = localStorage.getItem("aaradhyaMartProductsV1");
      products = saved ? JSON.parse(saved) : window.STARTER_PRODUCTS;
      if (!Array.isArray(products)) products = window.STARTER_PRODUCTS;
    }

    function money(v) { 
      return "₹" + Number(v || 0).toLocaleString("en-IN"); 
    }

    function render() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const cat = document.getElementById("categoryFilter").value;
      const sort = document.getElementById("sortFilter").value;
      
      // Filter by Store
      let list = products.filter(p => p.store === PAGE_STORE);
      
      // Filter by Category
      if (cat !== "All") list = list.filter(p => p.category === cat);
      
      // Filter by Search
      list = list.filter(p => [p.name, p.category].join(" ").toLowerCase().includes(query));
      
      // Sorting
      if (sort === "low") list.sort((a,b) => a.price - b.price);
      if (sort === "high") list.sort((a,b) => b.price - a.price);

      const grid = document.getElementById("productGrid");
      const emptyState = document.getElementById("emptyState");

      if (list.length === 0) {
        grid.innerHTML = "";
        emptyState.classList.remove("hidden");
      } else {
        emptyState.classList.add("hidden");
        grid.innerHTML = list.map(p => {
          const isOut = p.stock <= 0;
          return `
          <article class="product-card">
            <div class="product-image-wrap" data-open="${p.id}">
              <img src="${p.image}" alt="${p.name}">
              ${p.tag ? `<span class="product-tag">${p.tag}</span>` : ""}
            </div>
            <div class="product-info">
              <span class="product-category">${p.category}</span>
              <h3>${p.name}</h3>
              <div class="product-price">${money(p.price)} ${p.originalPrice > p.price ? `<span class="old-price">${money(p.originalPrice)}</span>` : ""}</div>
              <div class="product-actions">
                <button class="small-button" data-open="${p.id}">VIEW</button>
                <button class="small-button primary" data-order="${p.id}" ${isOut ? 'disabled' : ''}>
                  ${isOut ? 'OUT OF STOCK' : 'ORDER ↗'}
                </button>
              </div>
            </div>
          </article>`;
        }).join("");
      }
    }

    function openProduct(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      
      const dialog = document.getElementById("productDialog");
      document.getElementById("dialogContent").innerHTML = `
        <div class="dialog-layout">
          <img src="${p.image}" alt="${p.name}">
          <div class="dialog-details">
            <span class="product-category">${p.category}</span>
            <h2>${p.name}</h2>
            <div class="product-price">${money(p.price)}</div>
            <p>${p.description}</p>
            
            ${p.sizes && p.sizes.length > 0 ? `
            <label>Select Size:</label>
            <select id="sizeChoice">
              ${p.sizes.map(s => `<option>${s}</option>`).join("")}
            </select>` : ''}
            
            <button class="button-navy" id="dialogOrder">ORDER ON WHATSAPP ↗</button>
          </div>
        </div>`;
      
      dialog.showModal();
      
      document.getElementById("dialogOrder").onclick = () => {
        const size = document.getElementById("sizeChoice")?.value || "N/A";
        const msg = `Hello Aaradhya Fashion!\nI want to order:\nProduct: ${p.name}\nSize: ${size}\nPrice: ${money(p.price)}`;
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
      };
    }

    document.addEventListener("DOMContentLoaded", () => {
      load();
      
      // Setup Category Dropdown
      const catSelect = document.getElementById("categoryFilter");
      const storeProducts = products.filter(p => p.store === PAGE_STORE);
      const categories = [...new Set(storeProducts.map(p => p.category))];
      
      categories.forEach(c => {
        catSelect.innerHTML += `<option value="${c}">${c}</option>`;
      });

      // Check URL for Category Parameter (From Homepage links)
      const urlParams = new URLSearchParams(window.location.search);
      const urlCategory = urlParams.get('category');
      
      if (urlCategory && categories.includes(urlCategory)) {
        catSelect.value = urlCategory;
      }

      // Initial Render
      render();
      
      // Event Listeners
      document.getElementById("searchInput").addEventListener("input", render);
      document.getElementById("categoryFilter").addEventListener("change", render);
      document.getElementById("sortFilter").addEventListener("change", render);
      
      document.getElementById("productGrid").addEventListener("click", e => {
        const open = e.target.closest("[data-open]");
        const order = e.target.closest("[data-order]");
        
        if (open) openProduct(open.dataset.open);
        if (order && !order.disabled) {
          const p = products.find(x => x.id === order.dataset.order);
          const msg = `Hello Aaradhya Fashion!\nI want to order: ${p.name}`;
          window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
        }
      });
      
      document.getElementById("dialogClose").onclick = () => document.getElementById("productDialog").close();
    });
  </script>
</body>
</html>
