<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aaradhya Fashion | Clothing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">AM</span><span><strong>AARADHYA FASHION</strong><small>BY AARADHYA MART</small></span></a>
    <a href="index.html" class="header-wa" style="background:#fff; color:var(--navy); border:1px solid var(--navy);">← Back to Home</a>
  </header>

  <main class="section-wrap shop-section" style="padding-top: 40px;">
    <div class="section-heading" style="margin-bottom: 20px;">
      <span class="eyebrow">CLOTHING & APPAREL</span>
      <h2>Fashion Collection</h2>
    </div>

    <div class="shop-controls">
      <label class="search-field"><span>⌕</span><input id="searchInput" type="search" placeholder="Search clothes..." autocomplete="off"></label>
      <select id="sortFilter"><option value="featured">Sort: Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option></select>
    </div>

    <div class="category-nav" id="categoryNav"></div>
    <select id="categoryFilter" style="display:none;"><option value="All">All Categories</option></select>

    <div class="product-grid" id="productGrid"></div>
    <div class="empty-state hidden" id="emptyState"><span>✧</span><h3>No products found</h3></div>
  </main>

  <dialog class="product-dialog" id="productDialog">
    <button class="dialog-close" id="dialogClose">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <a href="cart.html" id="globalCartBtn" class="global-cart-btn">
    <span class="cart-icon-svg">🛒</span><span class="cart-text">Cart</span><span class="cart-badge" id="globalCartCount">0</span>
  </a>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 🔴 YAHAN APNA FIREBASE CONFIG PASTE KAREIN 🔴
    const firebaseConfig = { /* SAME AS ADMIN CONFIG */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const PAGE_STORE = "Fashion";
    let products = [];

    async function loadFirebaseProducts() {
      const querySnapshot = await getDocs(collection(db, "products"));
      products = [];
      querySnapshot.forEach((doc) => products.push({ id: doc.id, ...doc.data() }));
      render();
    }

    function money(v) { return "₹" + Number(v||0).toLocaleString("en-IN"); }
    
    function render() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const cat = document.getElementById("categoryFilter").value;
      const sort = document.getElementById("sortFilter").value;
      
      let list = products.filter(p => p.store === PAGE_STORE);
      if (cat !== "All") list = list.filter(p => p.category === cat);
      list = list.filter(p => [p.name, p.category].join(" ").toLowerCase().includes(query));
      if (sort === "low") list.sort((a,b)=>a.price-b.price);
      if (sort === "high") list.sort((a,b)=>b.price-a.price);

      const grid = document.getElementById("productGrid");
      const emptyState = document.getElementById("emptyState");

      if (list.length === 0) {
        grid.innerHTML = ""; emptyState.classList.remove("hidden");
      } else {
        emptyState.classList.add("hidden");
        grid.innerHTML = list.map(p => {
          const isOut = p.stock <= 0;
          return `
          <article class="product-card">
            <div class="product-image-wrap" data-open="${p.id}">
              <img src="${p.image}" alt="${p.name}">
              ${p.tag ? `<span class="product-tag">${p.tag}</span>` : ""}
            </div>
            <div class="product-info">
              <span class="product-category">${p.category}</span>
              <h3>${p.name}</h3>
              <div class="product-price">${money(p.price)} ${p.originalPrice>p.price ? `<span class="old-price">${money(p.originalPrice)}</span>`:""}</div>
              <div class="product-actions">
                <button class="small-button" data-open="${p.id}">VIEW</button>
                <button class="small-button primary" data-order="${p.id}" ${isOut?'disabled':''}>${isOut?'OUT':'BUY NOW'}</button>
                <button class="small-button add-cart-btn" data-cart="${p.id}" ${isOut?'disabled':''}>ADD TO CART 🛒</button>
              </div>
            </div>
          </article>`;
        }).join("");
      }
    }

    function openProduct(id) {
      const p = products.find(x => x.id === id);
      const d = document.getElementById("productDialog");
      document.getElementById("dialogContent").innerHTML = `
        <div class="dialog-layout">
          <img src="${p.image}" alt="${p.name}">
          <div class="dialog-details">
            <h2>${p.name}</h2>
            <div class="product-price">${money(p.price)}</div>
            <p>${p.description}</p>
            <label>Size:</label>
            <select id="sizeChoice">${(p.sizes||[]).map(s=>`<option>${s}</option>`).join("")}</select>
            <button class="button-navy" id="dialogCart">ADD TO CART 🛒</button>
            <button class="button-navy" id="dialogOrder" style="background:#c5a36b; color:#10243b; margin-top:5px;">BUY NOW ↗</button>
          </div>
        </div>`;
      d.showModal();
      
      document.getElementById("dialogOrder").onclick = () => {
        const size = document.getElementById("sizeChoice").value;
        window.location.href = `checkout.html?id=${p.id}&size=${encodeURIComponent(size)}&store=Aaradhya Fashion`;
      };
      document.getElementById("dialogCart").onclick = () => {
        const size = document.getElementById("sizeChoice").value;
        addToCart(p.id, size);
        d.close();
      };
    }

    function addToCart(id, size) {
      let cart = JSON.parse(localStorage.getItem("aaradhyaMartCart") || "[]");
      cart.push({ id: id, size: size || "Standard", qty: 1 });
      localStorage.setItem("aaradhyaMartCart", JSON.stringify(cart));
      showToast(); updateGlobalCart();
    }

    function showToast() {
      let t = document.querySelector('.toast-notification'); if (t) t.remove();
      const toast = document.createElement('div'); toast.className = 'toast-notification';
      toast.innerHTML = `<span class="toast-icon">✅</span> Item added to cart!`;
      document.body.appendChild(toast); setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
    }

    function updateGlobalCart() {
      try {
        const cart = JSON.parse(localStorage.getItem("aaradhyaMartCart") || "[]");
        const count = cart.reduce((sum, item) => sum + (Number(item.qty) || 1), 0);
        const badge = document.getElementById("globalCartCount");
        if (badge) {
          badge.textContent = count;
          badge.style.background = count === 0 ? "#ccc" : "var(--gold)";
          badge.style.color = count === 0 ? "#fff" : "var(--navy)";
        }
      } catch(e) {}
    }

    document.addEventListener("DOMContentLoaded", () => {
      const catSelect = document.getElementById("categoryFilter");
      const categoryNav = document.getElementById("categoryNav");
      const fashionCats = ["All", "Men", "Women", "Kids", "Sports Wear", "Winter Wear", "Accessories", "Footwear"];
      
      fashionCats.forEach(c => {
        catSelect.innerHTML += `<option value="${c}">${c}</option>`;
        const btn = document.createElement("button");
        btn.className = "cat-nav-btn" + (c === "All" ? " active" : "");
        btn.textContent = c === "All" ? "All" : (c.includes("Wear") ? c : c + " Wear");
        btn.onclick = () => {
          catSelect.value = c;
          document.querySelectorAll(".cat-nav-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active"); render();
        };
        categoryNav.appendChild(btn);
      });

      const urlCat = new URLSearchParams(window.location.search).get('category');
      if (urlCat && fashionCats.includes(urlCat)) catSelect.value = urlCat;

      loadFirebaseProducts();
      updateGlobalCart();
      
      document.getElementById("searchInput").addEventListener("input", render);
      document.getElementById("sortFilter").addEventListener("change", render);
      document.getElementById("categoryFilter").addEventListener("change", render);
      
      document.getElementById("productGrid").addEventListener("click", e => {
        const open = e.target.closest("[data-open]");
        const order = e.target.closest("[data-order]");
        const cartBtn = e.target.closest("[data-cart]");
        
        if(open) openProduct(open.dataset.open);
        if(order && !order.disabled) {
          const p = products.find(x=>x.id===order.dataset.order);
          window.location.href = `checkout.html?id=${p.id}&size=N/A&store=Aaradhya Fashion`;
        }
        if(cartBtn && !cartBtn.disabled) addToCart(cartBtn.dataset.cart);
      });
      document.getElementById("dialogClose").onclick = () => document.getElementById("productDialog").close();
    });
  </script>
</body>
</html>
