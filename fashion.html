<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aaradhya Fashion | Clothing</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2310243b'/><text x='50' y='68' font-size='55' font-family='Georgia' fill='%23c5a36b' text-anchor='middle'>A</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Local dialog/header styles (supplement to style.css) */
    .dialog-image-slider { position: relative; width: 100%; height: 100%; min-height: 400px; background: #f8f9fa; display: flex; align-items: center; justify-content: center; }
    .dialog-image-slider img { width: 100%; height: 100%; object-fit: contain; padding: 20px; transition: opacity 0.3s; }
    .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.9); border: 1px solid #ccc; width: 35px; height: 35px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .slider-btn:hover { background: #fff; color: var(--navy); }
    .slider-prev { left: 10px; }
    .slider-next { right: 10px; }
    .slider-dots { position: absolute; bottom: 15px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; z-index: 10; }
    .slider-dot { width: 10px; height: 10px; background: #ccc; border-radius: 50%; cursor: pointer; }
    .slider-dot.active { background: var(--navy); width: 12px; height: 12px; }

    .blinkit-deal-banner { background: linear-gradient(135deg, #fff3cd, #ffe69c); border: 2px solid #ffc107; border-radius: 12px; padding: 15px; margin-bottom: 25px; position: relative; overflow: hidden; box-shadow: 0 8px 25px rgba(255, 193, 7, 0.3); animation: pulseDeal 2s infinite alternate; }
    @keyframes pulseDeal { 0% { box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3); transform: scale(1); } 100% { box-shadow: 0 10px 30px rgba(255, 193, 7, 0.6); transform: scale(1.01); } }
    .blinkit-deal-banner::before { content: "🔥"; position: absolute; right: -10px; top: -10px; font-size: 80px; opacity: 0.1; transform: rotate(15deg); }
    .deal-banner-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .deal-banner-header h3 { margin: 0; font: normal 20px Georgia, serif; color: #d97706; display: flex; align-items: center; gap: 8px; }
    .deal-banner-header span { font-size: 10px; background: #ef4444; color: #fff; padding: 2px 8px; border-radius: 10px; animation: blinkText 1s infinite alternate; }
    @keyframes blinkText { 0% { opacity: 1; } 100% { opacity: 0.5; } }
    
    .deal-products-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
    .deal-products-scroll::-webkit-scrollbar { display: none; }
    
    .deal-mini-card { background: #fff; border-radius: 8px; padding: 8px; min-width: 130px; max-width: 130px; border: 1px solid #ffeeba; cursor: pointer; transition: 0.2s; }
    .deal-mini-card:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    .deal-mini-card img { width: 100%; height: 100px; object-fit: contain; border-radius: 6px; }
    .deal-mini-card h4 { margin: 5px 0 2px; font-size: 11px; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .deal-mini-card .price { font-size: 13px; font-weight: bold; color: #ef4444; }
    .deal-mini-card .price span { font-size: 10px; color: #aaa; text-decoration: line-through; margin-left: 3px; font-weight: normal; }
    .deal-mini-card .offer-tag { font-size: 9px; color: #10b981; font-weight: bold; display: block; margin-top: 2px; }

    .review-list { margin-top: 15px; border-top: 1px solid #ddd; padding-top: 15px; max-height: 150px; overflow-y: auto; }
    .review-item { background: #f8f9fa; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
    .review-item .stars { color: #f59e0b; font-size: 12px; }
    .review-item .name { font-weight: bold; font-size: 12px; color: var(--navy); }
    .review-item .comment { font-size: 12px; color: #555; margin-top: 3px; }

    .header-actions { display: flex; align-items: center; gap: 8px; }
    .header-support-btn { font-size: 11px; background: #25D366; color: #fff; padding: 13px 16px; border-radius: 4px; text-decoration: none; font-weight: bold; letter-spacing: 0.5px; transition: 0.3s; display: inline-flex; align-items: center; gap: 5px; }
    .header-support-btn:hover { background: #128C7E; }

    .shop-heading-row { display: flex; justify-content: space-between; align-items: end; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }

    @media (max-width: 650px) {
      .header-actions { gap: 6px; }
      .header-wa, .header-support-btn { padding: 9px 12px !important; font-size: 10px !important; }
      .header-support-btn svg { display: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">AM</span><span><strong>AARADHYA FASHION</strong><small>BY AARADHYA MART</small></span></a>
    <div class="header-actions">
      <a href="support.html" class="header-support-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        Support
      </a>
      <a href="index.html" class="header-wa" style="background:#fff; color:var(--navy); border:1px solid var(--navy);">← Home</a>
    </div>
  </header>

  <main class="section-wrap shop-section" style="padding-top: 40px;">
    
    <section id="blinkitDealSection" class="blinkit-deal-banner" style="display:none;">
      <div class="deal-banner-header">
        <h3>⚡ Deal of the Day <span>ENDS SOON</span></h3>
      </div>
      <div class="deal-products-scroll" id="dealProductsScroll"></div>
    </section>

    <div class="shop-heading-row">
      <div>
        <span class="eyebrow">CLOTHING & APPAREL</span>
        <h2 style="margin: 6px 0 0;">Fashion Collection</h2>
      </div>
      <span class="product-count-label">Showing <strong id="productCount">0</strong> products</span>
    </div>

    <div class="shop-controls">
      <label class="search-field"><span>⌕</span><input id="searchInput" type="search" placeholder="Search clothes..." autocomplete="off"></label>
      <select id="sortFilter"><option value="featured">Sort: Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option></select>
    </div>

    <div class="category-nav" id="categoryNav"></div>
    <select id="categoryFilter" style="display:none;"><option value="All">All Categories</option></select>

    <div class="shop-trust-row">
      <span>🚚 Free Delivery above ₹500</span>
      <span>✅ Easy 24hr Size Exchange</span>
      <span>⚡ Same Day Dispatch</span>
      <span>🛡️ 100% Secure</span>
    </div>

    <div class="product-grid" id="productGrid"></div>
    <div class="empty-state hidden" id="emptyState"><span>✧</span><h3>No products found</h3></div>
  </main>

  <dialog class="product-dialog" id="productDialog">
    <button class="dialog-close" id="dialogClose">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <a href="cart.html" id="globalCartBtn" class="global-cart-btn"><span class="cart-icon-svg">🛒</span><span class="cart-text">Cart</span><span class="cart-badge" id="globalCartCount">0</span></a>
  <a href="https://wa.me/918931911428?text=Hello%20Aaradhya%20Mart" target="_blank" class="whatsapp-float-btn" aria-label="Chat on WhatsApp"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16.004 2C8.28 2 2 8.28 2 16c0 2.47.64 4.79 1.76 6.81L2 30l7.39-1.71A13.93 13.93 0 0 0 16.004 30C23.72 30 30 23.72 30 16S23.72 2 16.004 2zm0 2.31c6.76 0 12.23 5.47 12.23 12.23 0 6.76-5.47 12.23-12.23 12.23-2.13 0-4.13-.55-5.86-1.51l-.42-.23-4.32 1 1-4.21-.24-.4A12.17 12.17 0 0 1 3.77 16c0-6.76 5.47-12.23 12.23-12.23z" fill="#fff"/><path d="M21.66 18.14c-.23-.12-1.38-.68-1.6-.76-.21-.08-.37-.12-.53.12-.16.24-.61.76-.75.92-.14.16-.28.18-.51.06-.23-.12-1-.37-1.91-1.18-.71-.63-1.18-1.41-1.32-1.65-.14-.24-.02-.37.1-.49.11-.11.23-.28.35-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.53-1.27-.72-1.74-.19-.46-.38-.4-.53-.4h-.45c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.57.18 1.09.15 1.5.09.46-.07 1.38-.56 1.58-1.11.2-.55.2-1.02.14-1.11-.06-.09-.22-.15-.45-.27z" fill="#fff"/></svg></a>
  <a href="track.html" class="track-float-btn" aria-label="Track Order"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg><span>Track Order</span></a>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAffhI69b-piezGsdI5E1lUVcNj9nobG8Y", authDomain: "aaradhya-mart.firebaseapp.com", projectId: "aaradhya-mart", storageBucket: "aaradhya-mart.firebasestorage.app", messagingSenderId: "146782544824", appId: "1:146782544824:web:d605e1971d3480fab1654d" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    const PAGE_STORE = "Fashion"; let products = [];
    let currentImages = []; let currentImgIndex = 0;

    const PLACEHOLDER = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'><rect width='400' height='400' fill='%23f8f9fa'/><text x='200' y='200' font-size='52' font-family='Georgia' fill='%23c5a36b' text-anchor='middle' dominant-baseline='middle' opacity='0.5'>AM</text></svg>";

    async function loadFirebaseProducts() {
      const querySnapshot = await getDocs(collection(db, "products"));
      products = []; querySnapshot.forEach((doc) => products.push({ id: doc.id, ...doc.data() }));
      
      const catSelect = document.getElementById("categoryFilter");
      catSelect.innerHTML = `<option value="All">All Categories</option>`;
      const uniqueCats = [...new Set(products.filter(p => p.store === PAGE_STORE).map(p => p.category).filter(Boolean))];
      const catNav = document.getElementById("categoryNav");
      catNav.innerHTML = `<button class="cat-nav-btn active" data-cat="All">All</button>` +
        uniqueCats.map(c => `<button class="cat-nav-btn" data-cat="${c}">${c}</button>`).join("");
      
      catNav.querySelectorAll(".cat-nav-btn").forEach(btn => {
        btn.onclick = () => {
          catNav.querySelectorAll(".cat-nav-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          catSelect.value = btn.dataset.cat;
          render();
        };
      });
      
      render();
    }

    function money(v) { return "₹" + Number(v||0).toLocaleString("en-IN"); }
    
    function render() {
      const queryStr = document.getElementById("searchInput").value.toLowerCase();
      const cat = document.getElementById("categoryFilter").value;
      const sort = document.getElementById("sortFilter").value;
      
      let list = products.filter(p => p.store === PAGE_STORE);
      if (cat !== "All") list = list.filter(p => p.category === cat);
      list = list.filter(p => [p.name, p.category].join(" ").toLowerCase().includes(queryStr));
      if (sort === "low") list.sort((a,b)=>a.price-b.price);
      if (sort === "high") list.sort((a,b)=>b.price-a.price);

      document.getElementById("productCount").textContent = list.length;

      const grid = document.getElementById("productGrid"); 
      const emptyState = document.getElementById("emptyState");
      
      if (list.length === 0) { 
        grid.innerHTML = ""; 
        emptyState.classList.remove("hidden"); 
        return;
      }
      emptyState.classList.add("hidden");

      let html = list.map(p => {
        const isOut = p.stock <= 0;
        let sizeOptions = p.sizes?.length > 0 ? p.sizes.map(s => `<option value="${s}">${s}</option>`).join("") : `<option value="Standard">Standard</option>`;
        let colorOptions = p.colors?.length > 0 ? p.colors.map(c => `<option value="${c}">${c}</option>`).join("") : `<option value="Standard">Standard</option>`;
        const firstImg = p.image ? p.image.split(',')[0].trim() : PLACEHOLDER;

        return `
        <article class="product-card">
          <div class="product-image-wrap" data-open="${p.id}">
            <img src="${firstImg}" alt="${p.name}" loading="lazy" onerror="this.src='${PLACEHOLDER}'">
            <div class="quick-view-overlay">Quick View</div>
            ${p.tag ? `<span class="product-tag">${p.tag}</span>` : ''}
            ${isOut ? `<span class="out-of-stock-tag">SOLD OUT</span>` : ''}
          </div>
          <div class="product-info">
            <span class="product-category" data-open="${p.id}">${p.category || 'Fashion'}</span>
            <h3 data-open="${p.id}" style="cursor:pointer;">${p.name}</h3>
            
            <div class="price-row">
              <span class="price-display">${money(p.price)}</span>
              ${!isOut ? `<select id="unit-${p.id}" class="unit-pill">${sizeOptions}</select>` : ''}
            </div>
            ${!isOut && p.colors?.length > 0 ? `<select id="color-${p.id}" class="unit-pill-full">${colorOptions}</select>` : ''}
            
            <div class="product-actions-modern">
              <button class="btn-add-cart" data-cart="${p.id}" ${isOut?'disabled':''}>🛒 Add</button>
              <button class="btn-buy-now" data-order="${p.id}" ${isOut?'disabled':''}>Buy Now</button>
            </div>
          </div>
        </article>`;
      }).join("");

      if (list.length < 4) {
        html += `
        <div class="coming-soon-card">
          <div class="coming-soon-icon">👗</div>
          <h3>More styles coming soon</h3>
          <p>New arrivals every week!</p>
          <a href="https://wa.me/918931911428?text=Hi%2C%20I%20want%20to%20request%20a%20fashion%20product" target="_blank" rel="noopener">Request a Style</a>
        </div>`;
      }

      grid.innerHTML = html;
    }

    async function openProduct(id) {
      const p = products.find(x => x.id === id); 
      if(!p) return;
      let imgArray = p.image ? p.image.split(",").map(img => img.trim()) : [PLACEHOLDER];
      currentImages = imgArray; currentImgIndex = 0;
      const d = document.getElementById("productDialog");
      
      let sliderHtml = `
        <div class="dialog-image-slider">
          <img id="mainProductImage" src="${currentImages[0]}" alt="${p.name}">
          ${currentImages.length > 1 ? `
            <button class="slider-btn slider-prev" onclick="changeImage(-1)">❮</button>
            <button class="slider-btn slider-next" onclick="changeImage(1)">❯</button>
            <div class="slider-dots" id="sliderDots">
              ${currentImages.map((_, i) => `<div class="slider-dot ${i===0?'active':''}" onclick="setImage(${i})"></div>`).join("")}
            </div>
          ` : ''}
        </div>
      `;

      const rq = query(collection(db, "reviews"), where("productId", "==", p.id));
      const rSnap = await getDocs(rq);
      let reviewsHtml = "";
      if(rSnap.empty) {
        reviewsHtml = `<p style="font-size:11px; color:#777; font-style:italic;">No reviews yet. Be the first to review!</p>`;
      } else {
        rSnap.forEach(rd => {
          const r = rd.data();
          reviewsHtml += `
            <div class="review-item">
              <div class="stars">${'⭐'.repeat(r.rating)}</div>
              <div class="name">${r.customerName}</div>
              <div class="comment">${r.comment}</div>
            </div>
          `;
        });
      }

      let colorHtml = p.colors?.length > 0 ? `
        <label>Colour:</label>
        <select id="colorChoice">${p.colors.map(c=>`<option>${c}</option>`).join("")}</select>
      ` : '';

      document.getElementById("dialogContent").innerHTML = `
        <div class="dialog-layout">
          ${sliderHtml}
          <div class="dialog-details">
            <h2>${p.name}</h2>
            <div class="product-price">${money(p.price)}</div>
            <p>${p.description || 'Premium quality fashion wear.'}</p>
            <label>Size:</label>
            <select id="sizeChoice">${(p.sizes||['Standard']).map(s=>`<option>${s}</option>`).join("")}</select>
            ${colorHtml}
            <button class="button-navy" id="dialogCart" style="margin-top:10px;">ADD TO CART 🛒</button>
            <button class="button-navy" id="dialogOrder" style="background:#c5a36b; color:#10243b; margin-top:5px;">BUY NOW ↗</button>
            
            <div class="review-list">
              <h4 style="font-size:13px; margin:0 0 5px; color:var(--navy);">Customer Reviews</h4>
              ${reviewsHtml}
            </div>
          </div>
        </div>`;
      
      d.showModal();
      
      document.getElementById("dialogOrder").onclick = () => { 
        const size = document.getElementById("sizeChoice").value; 
        const color = document.getElementById("colorChoice")?.value || "Standard";
        window.location.href = `checkout.html?id=${p.id}&size=${encodeURIComponent(size)}&color=${encodeURIComponent(color)}&store=Aaradhya Fashion`; 
      };
      document.getElementById("dialogCart").onclick = () => { 
        const size = document.getElementById("sizeChoice").value; 
        const color = document.getElementById("colorChoice")?.value || "Standard";
        addToCart(p.id, size, color); 
        d.close(); 
      };
    }

    window.changeImage = function(step) {
      currentImgIndex += step;
      if(currentImgIndex >= currentImages.length) currentImgIndex = 0;
      if(currentImgIndex < 0) currentImgIndex = currentImages.length - 1;
      updateSliderUI();
    }
    window.setImage = function(index) { currentImgIndex = index; updateSliderUI(); }
    function updateSliderUI() {
      document.getElementById("mainProductImage").src = currentImages[currentImgIndex];
      const dots = document.querySelectorAll(".slider-dot");
      dots.forEach((dot, i) => { if(i === currentImgIndex) dot.classList.add("active"); else dot.classList.remove("active"); });
    }

    function addToCart(id, unit, color) {
      let cart = JSON.parse(localStorage.getItem("aaradhyaMartCart") || "[]"); 
      cart.push({ id: id, size: unit, color: color, qty: 1 });
      localStorage.setItem("aaradhyaMartCart", JSON.stringify(cart)); showToast(); updateGlobalCart();
    }

    function showToast() {
      let t = document.querySelector('.toast-notification'); if (t) t.remove();
      const toast = document.createElement('div'); toast.className = 'toast-notification'; toast.innerHTML = `<span class="toast-icon">✅</span> Item added!`;
      document.body.appendChild(toast); setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
    }

    function updateGlobalCart() {
      try {
        const cart = JSON.parse(localStorage.getItem("aaradhyaMartCart") || "[]"); const count = cart.reduce((sum, item) => sum + (Number(item.qty) || 1), 0);
        const badge = document.getElementById("globalCartCount"); if (badge) { badge.textContent = count; badge.style.background = count === 0 ? "#ccc" : "var(--gold)"; badge.style.color = count === 0 ? "#fff" : "var(--navy)"; }
      } catch(e) {}
    }

    async function loadDeals() {
      try {
        const q = query(collection(db, "products"), where("isDeal", "==", true), where("store", "==", "Fashion")); 
        const querySnapshot = await getDocs(q);
        const scrollBox = document.getElementById("dealProductsScroll"); 
        const dealSection = document.getElementById("blinkitDealSection");
        
        if(querySnapshot.empty) { dealSection.style.display = "none"; return; } 
        dealSection.style.display = "block";
        
        let html = "";
        querySnapshot.forEach((doc) => {
          const p = doc.data();
          const firstImg = p.image ? p.image.split(',')[0].trim() : PLACEHOLDER;
          const discount = p.originalPrice > p.price ? Math.round(((p.originalPrice - p.price) / p.originalPrice) * 100) : 0;
          html += `
            <div class="deal-mini-card" onclick="openProduct('${doc.id}')">
              <img src="${firstImg}" alt="${p.name}">
              <h4>${p.name}</h4>
              <div class="price">₹${p.price} <span>₹${p.originalPrice}</span></div>
              ${discount > 0 ? `<span class="offer-tag">${discount}% OFF</span>` : ''}
            </div>
          `;
        });
        scrollBox.innerHTML = html;
      } catch(e) {}
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadFirebaseProducts(); updateGlobalCart(); loadDeals();
      
      document.getElementById("searchInput").addEventListener("input", render); 
      document.getElementById("sortFilter").addEventListener("change", render);
      
      document.addEventListener("click", e => {
        const open = e.target.closest("[data-open]"); const order = e.target.closest("[data-order]"); const cartBtn = e.target.closest("[data-cart]");
        if(open) openProduct(open.dataset.open);
        if(order && !order.disabled) { 
          const p = products.find(x=>x.id===order.dataset.order); 
          const selectedSize = document.getElementById(`unit-${p.id}`)?.value || "Standard"; 
          const selectedColor = document.getElementById(`color-${p.id}`)?.value || "Standard";
          window.location.href = `checkout.html?id=${p.id}&size=${encodeURIComponent(selectedSize)}&color=${encodeURIComponent(selectedColor)}&store=Aaradhya Fashion`; 
        }
        if(cartBtn && !cartBtn.disabled) { 
          const pId = cartBtn.dataset.cart; 
          const selectedSize = document.getElementById(`unit-${pId}`)?.value || "Standard"; 
          const selectedColor = document.getElementById(`color-${pId}`)?.value || "Standard";
          addToCart(pId, selectedSize, selectedColor); 
        }
      });
      document.getElementById("dialogClose").onclick = () => document.getElementById("productDialog").close();
    });
  </script>
</body>
</html>
