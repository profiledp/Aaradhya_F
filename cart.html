<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart | Aaradhya Mart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">AM</span><span><strong>AARADHYA MART</strong><small>SHOPPING CART</small></span></a>
    <a href="index.html" class="header-wa" style="background:#fff; color:var(--navy); border:1px solid var(--navy);">← Continue Shopping</a>
  </header>

  <main class="cart-container">
    <h2 style="font-family:Georgia; color:var(--navy);">Shopping Cart</h2>
    <div id="cartItems"></div>
    
    <div class="cart-summary-box" id="cartSummary" style="display:none;">
      <div class="cart-total">Total: ₹<span id="cartTotal">0</span></div>
      <button class="button-navy" onclick="proceedToCheckout()" style="width:auto; padding:15px 30px; border-radius:6px; cursor:pointer;">PROCEED TO CHECKOUT ↗</button>
    </div>
    
    <div id="emptyCart" style="text-align:center; padding: 50px; display:none;">
      <h3 style="color:var(--muted);">Your cart is empty.</h3>
      <a href="index.html" class="button-navy" style="display:inline-block; margin-top:15px; text-decoration:none; width:auto; padding:12px 25px; border-radius:6px;">Start Shopping</a>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 🔴 APNA FIREBASE CONFIG YAHAN PASTE KAREIN 🔴
    const firebaseConfig = {
      apiKey: "AIzaSyAffhI69b-piezGsdI5E1lUVcNj9nobG8Y",
      authDomain: "aaradhya-mart.firebaseapp.com",
      projectId: "aaradhya-mart",
      storageBucket: "aaradhya-mart.firebasestorage.app",
      messagingSenderId: "146782544824",
      appId: "1:146782544824:web:d605e1971d3480fab1654d",
      measurementId: "G-L6VJBL7ESY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allProducts = [];
    let cartData = [];

    async function loadCart() {
      // Show loading initially
      document.getElementById("cartItems").innerHTML = "<p style='text-align:center; color:var(--muted);'>Loading your cart...</p>";

      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        allProducts = [];
        querySnapshot.forEach((doc) => allProducts.push({ id: doc.id, ...doc.data() }));
        
        const savedCart = localStorage.getItem("aaradhyaMartCart");
        cartData = savedCart ? JSON.parse(savedCart) : [];
      } catch(e) { 
        console.error(e);
        cartData = []; 
      }

      renderCart();
    }

    function formatMoney(amount) {
      return "₹" + Number(amount || 0).toLocaleString("en-IN");
    }

    function renderCart() {
      const container = document.getElementById("cartItems");
      const summary = document.getElementById("cartSummary");
      const empty = document.getElementById("emptyCart");
      
      if (cartData.length === 0) {
        container.innerHTML = ""; 
        summary.style.display = "none"; 
        empty.style.display = "block"; 
        return;
      }
      
      empty.style.display = "none"; 
      summary.style.display = "block";
      
      let total = 0;
      let html = "";

      cartData.forEach((item, index) => {
        // Product ko ID se dhoondhein
        const p = allProducts.find(x => x.id === item.id);
        if(!p) return; // Skip if product was deleted from admin
        
        const itemTotal = Number(p.price) * Number(item.qty);
        total += itemTotal;

        html += `
          <div class="cart-item">
            <img src="${p.image}" alt="${p.name}">
            <div class="cart-item-info">
              <h4>${p.name}</h4>
              <p>Size: ${item.size} | Store: ${p.store}</p>
              <p style="font-weight:bold; color:var(--navy); margin-top:5px;">${formatMoney(p.price)}</p>
              <button class="cart-remove" onclick="removeFromCart(${index})">Remove</button>
            </div>
            <div>
              <label style="font-size:10px;">Qty:</label><br>
              <input type="number" class="cart-qty-input" value="${item.qty}" min="1" onchange="updateQty(${index}, this.value)">
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      document.getElementById("cartTotal").textContent = total.toLocaleString("en-IN");
    }

    window.updateQty = function(index, newQty) {
      let qty = parseInt(newQty);
      if(qty < 1 || isNaN(qty)) qty = 1;
      cartData[index].qty = qty;
      localStorage.setItem("aaradhyaMartCart", JSON.stringify(cartData));
      renderCart();
    }

    window.removeFromCart = function(index) {
      cartData.splice(index, 1);
      localStorage.setItem("aaradhyaMartCart", JSON.stringify(cartData));
      renderCart();
    }

    window.proceedToCheckout = function() {
      if(cartData.length > 0) window.location.href = "checkout.html";
    }

    document.addEventListener("DOMContentLoaded", loadCart);
  </script>
</body>
</html>
