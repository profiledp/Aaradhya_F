<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart | Aaradhya Mart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .clear-cart-btn { background: #fee2e2; color: #ef4444; border: 1px solid #fca5a5; padding: 8px 15px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .clear-cart-btn:hover { background: #fecaca; }
    .cart-page-wrap { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .cart-page-title { font: normal 28px Georgia, serif; color: var(--navy); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .cart-item { display: flex; gap: 20px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 15px; margin-bottom: 15px; align-items: center; }
    .cart-item-img { width: 90px; height: 90px; object-fit: contain; border-radius: 8px; border: 1px solid #f0f0f0; padding: 5px; background: #fff; }
    .cart-item-details { flex: 1; }
    .cart-item-details h4 { margin: 0 0 5px; font-family: Georgia, serif; font-size: 18px; color: var(--navy); }
    .cart-item-details p { margin: 0 0 5px; font-size: 12px; color: var(--muted); }
    .cart-item-price { font-weight: bold; font-size: 16px; color: var(--navy); }
    .cart-item-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .qty-box { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .qty-box input { width: 40px; text-align: center; border: none; outline: none; padding: 8px 0; font-size: 14px; font-weight: bold; }
    .btn-remove { background: none; border: none; color: #ef4444; font-size: 12px; cursor: pointer; text-decoration: underline; padding: 0; }
    .cart-summary { background: var(--cream); padding: 25px; border-radius: 12px; margin-top: 30px; text-align: right; border: 1px solid var(--line); }
    .cart-summary-total { font-size: 24px; font-weight: bold; color: var(--navy); margin-bottom: 15px; }
    .empty-cart-msg { text-align: center; padding: 50px 20px; }
    .empty-cart-msg h3 { color: var(--muted); font-size: 20px; margin-bottom: 20px; }
    @media (max-width: 650px) {
      .cart-item { flex-direction: column; align-items: flex-start; position: relative; }
      .cart-item-img { width: 80px; height: 80px; }
      .cart-item-actions { width: 100%; flex-direction: row; justify-content: space-between; align-items: center; margin-top: 10px; }
      .cart-page-title { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">AM</span><span><strong>AARADHYA MART</strong><small>SHOPPING CART</small></span></a>
    <a href="index.html" class="header-wa" style="background:#fff; color:var(--navy); border:1px solid var(--navy);">← Continue Shopping</a>
  </header>

  <main class="cart-page-wrap">
    <div class="cart-page-title">
      <span>Shopping Cart</span>
      <button id="clearCartBtn" class="clear-cart-btn" style="display:none;">Clear Cart 🗑️</button>
    </div>
    
    <div id="loadingCart" style="text-align:center; padding: 20px; font-weight:bold; color: var(--muted);">Loading your items...</div>
    <div id="cartItemsList"></div>
    
    <div class="cart-summary" id="cartSummary" style="display:none;">
      <div class="cart-summary-total">Total: ₹<span id="cartTotal">0</span></div>
      <button class="button-navy" onclick="proceedToCheckout()" style="width:100%; max-width:300px; padding:15px; border-radius:8px; cursor:pointer; border:none; font-size:14px; font-weight:bold;">PROCEED TO CHECKOUT ↗</button>
    </div>
    
    <div id="emptyCart" class="empty-cart-msg" style="display:none;">
      <h3>Your cart is empty.</h3>
      <a href="index.html" class="button-navy" style="display:inline-block; padding:12px 25px; border-radius:6px; text-decoration:none;">Start Shopping</a>
    </div>
  </main>

  <div class="custom-modal-overlay" id="clearCartModal" style="position:fixed; inset:0; background:rgba(16,36,59,0.6); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:10000; opacity:0; visibility:hidden; transition:0.3s;">
    <div style="background:#fff; padding:30px; border-radius:12px; width:90%; max-width:400px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.2);">
      <div style="font-size:40px; margin-bottom:15px;">🗑️</div>
      <h3 style="font-family:Georgia; color:var(--navy); margin-top:0;">Clear Cart?</h3>
      <p style="color:#777; font-size:14px; margin-bottom:25px;">Are you sure you want to remove all items?</p>
      <div style="display:flex; gap:10px;">
        <button onclick="closeClearModal()" style="flex:1; padding:12px; border:1px solid #ccc; background:#fff; border-radius:6px; cursor:pointer; font-weight:bold;">Cancel</button>
        <button onclick="confirmClearCart()" style="flex:1; padding:12px; border:none; background:#ef4444; color:#fff; border-radius:6px; cursor:pointer; font-weight:bold;">Yes, Clear</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAffhI69b-piezGsdI5E1lUVcNj9nobG8Y", authDomain: "aaradhya-mart.firebaseapp.com", projectId: "aaradhya-mart", storageBucket: "aaradhya-mart.firebasestorage.app", messagingSenderId: "146782544824", appId: "1:146782544824:web:d605e1971d3480fab1654d" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    let allProducts = []; let cartData = [];

    async function initCart() {
      try {
        const savedCart = localStorage.getItem("aaradhyaMartCart"); cartData = savedCart ? JSON.parse(savedCart) : [];
        const querySnapshot = await getDocs(collection(db, "products"));
        allProducts = []; querySnapshot.forEach((doc) => { allProducts.push({ id: doc.id, ...doc.data() }); });
        
        const initialLength = cartData.length;
        cartData = cartData.filter(item => allProducts.some(p => String(p.id) === String(item.id)));
        if(cartData.length !== initialLength) localStorage.setItem("aaradhyaMartCart", JSON.stringify(cartData));
        
        renderCart();
      } catch (error) {
        document.getElementById("loadingCart").innerHTML = "<span style='color:red'>Error loading cart.</span>";
      }
    }

    function renderCart() {
      document.getElementById("loadingCart").style.display = "none";
      const container = document.getElementById("cartItemsList"); const summary = document.getElementById("cartSummary");
      const empty = document.getElementById("emptyCart"); const clearBtn = document.getElementById("clearCartBtn");
      
      if (cartData.length === 0) { container.innerHTML = ""; summary.style.display = "none"; empty.style.display = "block"; clearBtn.style.display = "none"; return; }
      
      empty.style.display = "none"; summary.style.display = "block"; clearBtn.style.display = "block";
      let total = 0; let html = "";

      cartData.forEach((item, index) => {
        const p = allProducts.find(x => String(x.id) === String(item.id)); if (!p) return;
        const priceToUse = item.price || p.price; // Use calculated price if exists
        const itemTotal = Number(priceToUse) * Number(item.qty || 1); 
        total += itemTotal;
        const firstImg = p.image ? p.image.split(',')[0].trim() : 'https://placehold.co/100';

        html += `
          <div class="cart-item">
            <img src="${firstImg}" class="cart-item-img" alt="${p.name}">
            <div class="cart-item-details">
              <h4>${p.name}</h4>
              <p>Size: ${item.size} | Colour: ${item.color || 'Standard'}</p>
              <p>Store: ${p.store}</p>
              <div class="cart-item-price">₹${priceToUse}</div>
            </div>
            <div class="cart-item-actions">
              <button class="btn-remove" onclick="removeFromCart(${index})">Remove</button>
              <div class="qty-box"><input type="number" value="${item.qty}" min="1" max="${p.stock}" onchange="updateQty(${index}, this.value)"></div>
            </div>
          </div>`;
      });
      container.innerHTML = html;
      document.getElementById("cartTotal").textContent = total.toLocaleString("en-IN");
    }

    window.updateQty = function(index, newQty) {
      let qty = parseInt(newQty); if (isNaN(qty) || qty < 1) qty = 1;
      const p = allProducts.find(x => String(x.id) === String(cartData[index].id));
      if (qty > Number(p.stock)) { showToast("Only "+p.stock+" items available!"); qty = p.stock; }
      cartData[index].qty = qty; localStorage.setItem("aaradhyaMartCart", JSON.stringify(cartData)); renderCart();
    }

    window.removeFromCart = function(index) { cartData.splice(index, 1); localStorage.setItem("aaradhyaMartCart", JSON.stringify(cartData)); renderCart(); }
    window.proceedToCheckout = function() { if(cartData.length > 0) window.location.href = "checkout.html"; }

    document.getElementById("clearCartBtn").onclick = () => { document.getElementById("clearCartModal").style.opacity = "1"; document.getElementById("clearCartModal").style.visibility = "visible"; };
    window.closeClearModal = function() { document.getElementById("clearCartModal").style.opacity = "0"; document.getElementById("clearCartModal").style.visibility = "hidden"; }
    window.confirmClearCart = function() { localStorage.removeItem("aaradhyaMartCart"); cartData = []; renderCart(); closeClearModal(); }

    function showToast(msg) {
      let t = document.querySelector('.toast-notification'); if(t) t.remove();
      const toast = document.createElement('div'); toast.className='toast-notification'; toast.innerHTML = `<span class="toast-icon">⚠️</span> ${msg}`;
      document.body.appendChild(toast); setTimeout(()=>toast.classList.add('show'),10);
      setTimeout(()=>{toast.classList.remove('show'); setTimeout(()=>toast.remove(),400);},3000);
    }

    document.addEventListener("DOMContentLoaded", initCart);
  </script>
</body>
</html>
