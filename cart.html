<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart | Aaradhya Mart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .clear-cart-btn { background: #fee2e2; color: #ef4444; border: 1px solid #fca5a5; padding: 8px 15px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .clear-cart-btn:hover { background: #fecaca; }
    .custom-modal-overlay { position: fixed; inset: 0; background: rgba(16, 36, 59, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; }
    .custom-modal-overlay.active { opacity: 1; visibility: visible; }
    .custom-modal { background: #fff; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.2); transform: scale(0.8) translateY(20px); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .custom-modal-overlay.active .custom-modal { transform: scale(1) translateY(0); }
    .custom-modal h3 { font-family: Georgia, serif; color: var(--navy); margin-top: 0; font-size: 22px; }
    .custom-modal p { color: var(--muted); font-size: 14px; margin-bottom: 25px; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }
    .modal-btn { padding: 12px 25px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; flex: 1; }
    .btn-cancel { background: #fff; border: 1px solid var(--line); color: var(--ink); }
    .btn-cancel:hover { background: #f4f6f8; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">AM</span><span><strong>AARADHYA MART</strong><small>SHOPPING CART</small></span></a>
    <a href="index.html" class="header-wa" style="background:#fff; color:var(--navy); border:1px solid var(--navy);">← Continue Shopping</a>
  </header>

  <main class="cart-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h2 style="font-family:Georgia; color:var(--navy); margin: 0;">Shopping Cart</h2>
      <button class="clear-cart-btn" onclick="openClearModal()">Clear Cart 🗑️</button>
    </div>
    
    <div id="loadingCart" style="text-align:center; padding: 20px; font-weight:bold; color: var(--muted);">Loading your items...</div>

    <div id="cartItems"></div>
    
    <div class="cart-summary-box" id="cartSummary" style="display:none;">
      <div class="cart-total">Total: ₹<span id="cartTotal">0</span></div>
      <button class="button-navy" onclick="proceedToCheckout()" style="width:auto; padding:15px 30px; border-radius:6px; cursor:pointer;">PROCEED TO CHECKOUT ↗</button>
    </div>
    
    <div id="emptyCart" style="text-align:center; padding: 50px; display:none;">
      <h3 style="color:var(--muted);">Your cart is empty.</h3>
      <a href="index.html" class="button-navy" style="display:inline-block; margin-top:15px; text-decoration:none; width:auto; padding:12px 25px; border-radius:6px;">Start Shopping</a>
    </div>
  </main>

  <div class="custom-modal-overlay" id="clearCartModal">
    <div class="custom-modal">
      <div style="font-size: 40px; margin-bottom: 15px;">🗑️</div>
      <h3>Clear Cart?</h3>
      <p>Are you sure you want to remove all items from your shopping cart?</p>
      <div class="modal-actions">
        <button class="modal-btn btn-cancel" onclick="closeClearModal()">Cancel</button>
        <button class="modal-btn btn-danger" onclick="confirmClearCart()">Yes, Clear</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAffhI69b-piezGsdI5E1lUVcNj9nobG8Y",
      authDomain: "aaradhya-mart.firebaseapp.com",
      projectId: "aaradhya-mart",
      storageBucket: "aaradhya-mart.firebasestorage.app",
      messagingSenderId: "146782544824",
      appId: "1:146782544824:web:d605e1971d3480fab1654d",
      measurementId: "G-L6VJBL7ESY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allProducts = [];
    let cartData = [];

    async function initCart() {
      try {
        const savedCart = localStorage.getItem("aaradhyaMartCart");
        cartData = savedCart ? JSON.parse(savedCart) : [];
        const querySnapshot = await getDocs(collection(db, "products"));
        allProducts = [];
        querySnapshot.forEach((doc) => allProducts.push({ id: doc.id, ...doc.data() }));
        
        const initialLength = cartData.length;
        cartData = cartData.filter(item => allProducts.some(p => String(p.id) === String(item.id)));
        
        if(cartData.length !== initialLength) {
          localStorage.setItem("aaradhyaMartCart", JSON.stringify(cartData));
          if(typeof updateGlobalCart === 'function') updateGlobalCart();
        }
        renderCart();
      } catch (error) { document.getElementById("loadingCart").innerHTML = "Error loading."; }
    }

    function renderCart() {
      document.getElementById("loadingCart").style.display = "none";
      const container = document.getElementById("cartItems");
      const summary = document.getElementById("cartSummary");
      const empty = document.getElementById("emptyCart");
      
      if (cartData.length === 0) {
        container.innerHTML = ""; summary.style.display = "none"; empty.style.display = "block"; return;
      }
      
      empty.style.display = "none"; summary.style.display = "block";
      let total = 0;
      let html = "";

      cartData.forEach((item, index) => {
        const p = allProducts.find(x => String(x.id) === String(item.id));
        if (!p) return;
        const itemTotal = Number(p.price) * Number(item.qty || 1);
        total += itemTotal;

        html += `
          <div class="cart-item">
            <img src="${p.image || 'https://placehold.co/100'}" alt="${p.name}">
            <div class="cart-item-info">
              <h4>${p.name}</h4>
              <p>Size: ${item.size} | Store: ${p.store}</p>
              <p style="font-weight:bold; color:var(--navy); margin-top:5px;">₹${p.price}</p>
              <button class="cart-remove" onclick="removeFromCart(${index})">Remove</button>
            </div>
            <div>
              <label style="font-size:10px;">Qty (Max: ${p.stock}):</label><br>
              <input type="number" class="cart-qty-input" value="${item.qty}" min="1" max="${p.stock}" onchange="updateQty(${index}, this.value)">
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      document.getElementById("cartTotal").textContent = total.toLocaleString("en-IN");
    }

    window.openClearModal = function() { document.getElementById("clearCartModal").classList.add("active"); }
    window.closeClearModal = function() { document.getElementById("clearCartModal").classList.remove("active"); }
    window.confirmClearCart = function() {
      localStorage.removeItem("aaradhyaMartCart"); cartData = []; renderCart();
      if(typeof updateGlobalCart === 'function') updateGlobalCart(); closeClearModal();
    }

    // SMART STOCK UPDATE LOGIC HERE
    window.updateQty = function(index, newQty) {
      let qty = parseInt(newQty);
      if (isNaN(qty) || qty < 1) qty = 1;
      
      const p = allProducts.find(x => String(x.id) === String(cartData[index].id));
      const maxStock = p ? Number(p.stock) : 999;

      if (qty > maxStock) {
        alert(`Sorry, only ${maxStock} items are available in stock.`);
        qty = maxStock;
      }

      cartData[index].qty = qty;
      localStorage.setItem("aaradhyaMartCart", JSON.stringify(cartData));
      renderCart();
      if(typeof updateGlobalCart === 'function') updateGlobalCart();
    }

    window.removeFromCart = function(index) {
      cartData.splice(index, 1);
      localStorage.setItem("aaradhyaMartCart", JSON.stringify(cartData));
      renderCart();
      if(typeof updateGlobalCart === 'function') updateGlobalCart();
    }

    window.proceedToCheckout = function() { if(cartData.length > 0) window.location.href = "checkout.html"; }
    document.addEventListener("DOMContentLoaded", initCart);
  </script>
</body>
</html>
