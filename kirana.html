<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aaradhya Kirana | Grocery</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Naya Style Blinkit Jaisa */
    .product-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    
    .product-card { 
      border: 1px solid var(--line); 
      border-radius: 8px; 
      padding: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
      background: #fff;
      display: flex;
      flex-direction: column;
    }
    .product-card:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    
    .product-image-wrap {
      width: 100%;
      aspect-ratio: 1 / 1; /* Square shape */
      background: #fff; /* White background */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    
    .product-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Image poori fit hogi, kategi nahi */
      padding: 10px; /* Thoda gap image ke chaaro taraf */
    }
    
    .product-info { padding: 0; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .product-info h3 { font-size: 14px; margin: 5px 0; line-height: 1.3; height: 38px; overflow: hidden; font-family: Arial, sans-serif; font-weight: bold; }
    
    .unit-selector {
      width: 100%;
      padding: 6px;
      margin-top: 5px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #f8f9fa;
      font-size: 12px;
      color: var(--navy);
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }
    
    .product-actions { display: flex; gap: 8px; margin-top: 10px; }
    .small-button { font-size: 11px; padding: 8px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">AM</span><span><strong>AARADHYA KIRANA</strong><small>DAILY ESSENTIALS</small></span></a>
    <a href="index.html" class="header-wa" style="background:#fff; color:var(--navy); border:1px solid var(--navy);">← Back to Home</a>
  </header>

  <main class="section-wrap shop-section" style="padding-top: 40px;">
    <div class="section-heading" style="margin-bottom: 20px;">
      <span class="eyebrow">GROCERY & ESSENTIALS</span>
      <h2>Kirana Store</h2>
    </div>

    <div class="shop-controls">
      <label class="search-field"><span>⌕</span><input id="searchInput" type="search" placeholder="Search grocery..." autocomplete="off"></label>
      <select id="sortFilter"><option value="featured">Sort: Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option></select>
    </div>

    <div class="product-grid" id="productGrid"></div>
  </main>

  <a href="cart.html" id="globalCartBtn" class="global-cart-btn">
    <span class="cart-icon-svg">🛒</span><span class="cart-text">Cart</span><span class="cart-badge" id="globalCartCount">0</span>
  </a>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAffhI69b-piezGsdI5E1lUVcNj9nobG8Y",
      authDomain: "aaradhya-mart.firebaseapp.com",
      projectId: "aaradhya-mart",
      storageBucket: "aaradhya-mart.firebasestorage.app",
      messagingSenderId: "146782544824",
      appId: "1:146782544824:web:d605e1971d3480fab1654d",
      measurementId: "G-L6VJBL7ESY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const PAGE_STORE = "Kirana";
    let products = [];

    async function loadFirebaseProducts() {
      const querySnapshot = await getDocs(collection(db, "products"));
      products = [];
      querySnapshot.forEach((doc) => products.push({ id: doc.id, ...doc.data() }));
      render();
    }

    function money(v) { return "₹" + Number(v||0).toLocaleString("en-IN"); }
    
    function render() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const sort = document.getElementById("sortFilter").value;
      
      let list = products.filter(p => p.store === PAGE_STORE);
      list = list.filter(p => [p.name, p.category].join(" ").toLowerCase().includes(query));
      if (sort === "low") list.sort((a,b)=>a.price-b.price);
      if (sort === "high") list.sort((a,b)=>b.price-a.price);

      document.getElementById("productGrid").innerHTML = list.map(p => {
        const isOut = p.stock <= 0;
        
        let optionsHtml = "";
        if(p.sizes && p.sizes.length > 0) {
            optionsHtml = p.sizes.map(s => `<option value="${s}">${s}</option>`).join("");
        } else {
            optionsHtml = `<option value="${p.unit || '1 Unit'}">${p.unit || '1 Unit'}</option>`;
        }

        return `
        <article class="product-card">
          <div class="product-image-wrap">
            <img src="${p.image}" alt="${p.name}">
          </div>
          <div class="product-info">
            <span class="product-category" style="font-size:10px;">${p.category}</span>
            <h3>${p.name}</h3>
            <div class="product-price" style="margin-bottom:5px;">${money(p.price)}</div>
            
            ${!isOut ? `
              <select id="unit-${p.id}" class="unit-selector">
                ${optionsHtml}
              </select>
            ` : '<div style="color:red; font-size:12px; font-weight:bold; margin-bottom:10px;">OUT OF STOCK</div>'}

            <div class="product-actions">
              <button class="small-button primary" data-order="${p.id}" ${isOut?'disabled':''}>BUY</button>
              <button class="small-button add-cart-btn" data-cart="${p.id}" ${isOut?'disabled':''}>ADD 🛒</button>
            </div>
          </div>
        </article>`;
      }).join("");
    }

    function addToCart(id, unit) {
      let cart = JSON.parse(localStorage.getItem("aaradhyaMartCart") || "[]");
      cart.push({ id: id, size: unit, qty: 1 });
      localStorage.setItem("aaradhyaMartCart", JSON.stringify(cart));
      showToast(); updateGlobalCart();
    }

    function showToast() {
      let t = document.querySelector('.toast-notification'); if (t) t.remove();
      const toast = document.createElement('div'); toast.className = 'toast-notification';
      toast.innerHTML = `<span class="toast-icon">✅</span> Item added to cart!`;
      document.body.appendChild(toast); setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
    }

    function updateGlobalCart() {
      try {
        const cart = JSON.parse(localStorage.getItem("aaradhyaMartCart") || "[]");
        const count = cart.reduce((sum, item) => sum + (Number(item.qty) || 1), 0);
        const badge = document.getElementById("globalCartCount");
        if (badge) {
          badge.textContent = count;
          badge.style.background = count === 0 ? "#ccc" : "var(--gold)";
          badge.style.color = count === 0 ? "#fff" : "var(--navy)";
        }
      } catch(e) {}
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadFirebaseProducts(); updateGlobalCart();
      document.getElementById("searchInput").addEventListener("input", render);
      document.getElementById("sortFilter").addEventListener("change", render);
      
      document.getElementById("productGrid").addEventListener("click", e => {
        const order = e.target.closest("[data-order]");
        const cartBtn = e.target.closest("[data-cart]");
        
        if(order && !order.disabled) {
          const p = products.find(x=>x.id===order.dataset.order);
          const selectedUnit = document.getElementById(`unit-${p.id}`)?.value || p.unit || "Standard";
          window.location.href = `checkout.html?id=${p.id}&size=${encodeURIComponent(selectedUnit)}&store=Aaradhya Kirana`;
        }
        
        if(cartBtn && !cartBtn.disabled) {
          const pId = cartBtn.dataset.cart;
          const selectedUnit = document.getElementById(`unit-${pId}`)?.value || "Standard";
          addToCart(pId, selectedUnit);
        }
      });
    });
  </script>
</body>
</html>
