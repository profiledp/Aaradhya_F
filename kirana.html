<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aaradhya Kirana | Grocery</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @media (max-width: 768px) {
      .track-float-btn { bottom: 85px; left: 15px; padding: 8px 12px; border-width: 1px; }
      .track-float-btn span { display: none; }
      .track-float-btn svg { width: 20px; height: 20px; }
      .whatsapp-float-btn { bottom: 20px; left: 15px; width: 48px; height: 48px; }
      .whatsapp-float-btn svg { width: 24px; height: 24px; }
      .global-cart-btn { bottom: 20px; right: 15px; padding: 10px 14px; }
      .global-cart-btn .cart-text { display: none; }
      .global-cart-btn .cart-badge { width: 20px; height: 20px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">AM</span><span><strong>AARADHYA KIRANA</strong><small>DAILY ESSENTIALS</small></span></a>
    <a href="index.html" class="header-wa" style="background:#fff; color:var(--navy); border:1px solid var(--navy);">← Back to Home</a>
  </header>

  <main class="section-wrap shop-section" style="padding-top: 40px;">
    
    <section id="dealSection" style="display:none; background: #fff3cd; border: 2px dashed #ef4444; padding: 15px; border-radius: 12px; margin-bottom: 25px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h2 style="font: normal 20px Georgia, serif; color: #ef4444; margin:0;">🔥 Deal of the Day</h2>
      </div>
      <div class="product-grid" id="dealGrid" style="grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:10px;"></div>
    </section>

    <div class="section-heading" style="margin-bottom: 20px;">
      <span class="eyebrow">GROCERY & ESSENTIALS</span>
      <h2>Kirana Store</h2>
    </div>

    <div class="shop-controls">
      <label class="search-field"><span>⌕</span><input id="searchInput" type="search" placeholder="Search grocery..." autocomplete="off"></label>
      <select id="sortFilter"><option value="featured">Sort: Featured</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option></select>
    </div>

    <div class="product-grid" id="productGrid"></div>
  </main>

  <a href="cart.html" id="globalCartBtn" class="global-cart-btn"><span class="cart-icon-svg">🛒</span><span class="cart-text">Cart</span><span class="cart-badge" id="globalCartCount">0</span></a>
  <a href="https://wa.me/918931911428?text=Hello%20Aaradhya%20Mart" target="_blank" class="whatsapp-float-btn" aria-label="Chat on WhatsApp"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16.004 2C8.28 2 2 8.28 2 16c0 2.47.64 4.79 1.76 6.81L2 30l7.39-1.71A13.93 13.93 0 0 0 16.004 30C23.72 30 30 23.72 30 16S23.72 2 16.004 2zm0 2.31c6.76 0 12.23 5.47 12.23 12.23 0 6.76-5.47 12.23-12.23 12.23-2.13 0-4.13-.55-5.86-1.51l-.42-.23-4.32 1 1-4.21-.24-.4A12.17 12.17 0 0 1 3.77 16c0-6.76 5.47-12.23 12.23-12.23z" fill="#fff"/><path d="M21.66 18.14c-.23-.12-1.38-.68-1.6-.76-.21-.08-.37-.12-.53.12-.16.24-.61.76-.75.92-.14.16-.28.18-.51.06-.23-.12-1-.37-1.91-1.18-.71-.63-1.18-1.41-1.32-1.65-.14-.24-.02-.37.1-.49.11-.11.23-.28.35-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.53-1.27-.72-1.74-.19-.46-.38-.4-.53-.4h-.45c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.57.18 1.09.15 1.5.09.46-.07 1.38-.56 1.58-1.11.2-.55.2-1.02.14-1.11-.06-.09-.22-.15-.45-.27z" fill="#fff"/></svg></a>
  <a href="track.html" class="track-float-btn" aria-label="Track Order"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg><span>Track Order</span></a>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAffhI69b-piezGsdI5E1lUVcNj9nobG8Y", authDomain: "aaradhya-mart.firebaseapp.com", projectId: "aaradhya-mart", storageBucket: "aaradhya-mart.firebasestorage.app", messagingSenderId: "146782544824", appId: "1:146782544824:web:d605e1971d3480fab1654d", measurementId: "G-L6VJBL7ESY" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    const PAGE_STORE = "Kirana"; let products = [];

    async function loadFirebaseProducts() {
      const querySnapshot = await getDocs(collection(db, "products"));
      products = []; querySnapshot.forEach((doc) => products.push({ id: doc.id, ...doc.data() })); render();
    }

    function money(v) { return "₹" + Number(v||0).toLocaleString("en-IN"); }
    
    function render() {
      const queryStr = document.getElementById("searchInput").value.toLowerCase();
      const sort = document.getElementById("sortFilter").value;
      let list = products.filter(p => p.store === PAGE_STORE);
      list = list.filter(p => [p.name, p.category].join(" ").toLowerCase().includes(queryStr));
      if (sort === "low") list.sort((a,b)=>a.price-b.price);
      if (sort === "high") list.sort((a,b)=>b.price-a.price);

      document.getElementById("productGrid").innerHTML = list.map(p => {
        const isOut = p.stock <= 0;
        let optionsHtml = p.sizes?.length > 0 ? p.sizes.map(s => `<option value="${s}">${s}</option>`).join("") : `<option value="${p.unit || '1 Unit'}">${p.unit || '1 Unit'}</option>`;
        return `
        <article class="product-card">
          <div class="product-image-wrap"><img src="${p.image}" alt="${p.name}"></div>
          <div class="product-info">
            <span class="product-category">${p.category}</span><h3>${p.name}</h3>
            <div class="product-price">${money(p.price)}</div>
            ${!isOut ? `<select id="unit-${p.id}" class="unit-selector">${optionsHtml}</select>` : '<div style="color:red; font-size:10px; font-weight:bold; margin-bottom:5px;">OUT OF STOCK</div>'}
            <div class="product-actions"><button class="small-button primary" data-order="${p.id}" ${isOut?'disabled':''}>BUY</button><button class="small-button add-cart-btn" data-cart="${p.id}" ${isOut?'disabled':''}>ADD 🛒</button></div>
          </div>
        </article>`;
      }).join("");
    }

    function addToCart(id, unit) {
      let cart = JSON.parse(localStorage.getItem("aaradhyaMartCart") || "[]"); cart.push({ id: id, size: unit, qty: 1 });
      localStorage.setItem("aaradhyaMartCart", JSON.stringify(cart)); showToast(); updateGlobalCart();
    }

    function showToast() {
      let t = document.querySelector('.toast-notification'); if (t) t.remove();
      const toast = document.createElement('div'); toast.className = 'toast-notification'; toast.innerHTML = `<span class="toast-icon">✅</span> Item added!`;
      document.body.appendChild(toast); setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
    }

    function updateGlobalCart() {
      try {
        const cart = JSON.parse(localStorage.getItem("aaradhyaMartCart") || "[]"); const count = cart.reduce((sum, item) => sum + (Number(item.qty) || 1), 0);
        const badge = document.getElementById("globalCartCount"); if (badge) { badge.textContent = count; badge.style.background = count === 0 ? "#ccc" : "var(--gold)"; badge.style.color = count === 0 ? "#fff" : "var(--navy)"; }
      } catch(e) {}
    }

    async function loadDeals() {
      try {
        const q = query(collection(db, "products"), where("isDeal", "==", true), where("store", "==", "Kirana")); const querySnapshot = await getDocs(q);
        const dealGrid = document.getElementById("dealGrid"); const dealSection = document.getElementById("dealSection");
        if(querySnapshot.empty) { dealSection.style.display = "none"; return; } dealSection.style.display = "block";
        let html = "";
        querySnapshot.forEach((doc) => {
          const p = doc.data();
          html += `<article class="product-card" style="border: 1px solid #ef4444;"><div class="product-image-wrap"><img src="${p.image}" alt="${p.name}"><span style="position:absolute; top:5px; left:5px; background:#ef4444; color:#fff; padding:2px 6px; border-radius:4px; font-size:8px; font-weight:bold;">DEAL 🔥</span></div><div class="product-info"><h3 style="font-size:12px; height:32px;">${p.name}</h3><div style="font-size:11px; font-weight:bold; color:#ef4444;">₹${p.price} <span style="font-size:9px; color:#aaa; text-decoration:line-through;">₹${p.originalPrice}</span></div><button class="small-button primary" style="margin-top:5px; font-size:9px; padding:6px;" onclick="document.getElementById('searchInput').value='${p.name}'; document.getElementById('searchInput').dispatchEvent(new Event('input'));">View</button></div></article>`;
        });
        dealGrid.innerHTML = html;
      } catch(e) {}
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadFirebaseProducts(); updateGlobalCart(); loadDeals();
      document.getElementById("searchInput").addEventListener("input", render); document.getElementById("sortFilter").addEventListener("change", render);
      document.getElementById("productGrid").addEventListener("click", e => {
        const order = e.target.closest("[data-order]"); const cartBtn = e.target.closest("[data-cart]");
        if(order && !order.disabled) { const p = products.find(x=>x.id===order.dataset.order); const selectedUnit = document.getElementById(`unit-${p.id}`)?.value || p.unit || "Standard"; window.location.href = `checkout.html?id=${p.id}&size=${encodeURIComponent(selectedUnit)}&store=Aaradhya Kirana`; }
        if(cartBtn && !cartBtn.disabled) { const pId = cartBtn.dataset.cart; const selectedUnit = document.getElementById(`unit-${pId}`)?.value || "Standard"; addToCart(pId, selectedUnit); }
      });
    });
  </script>
</body>
</html>
