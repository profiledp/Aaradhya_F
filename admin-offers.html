<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Side Offers | Aaradhya Mart</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2310243b'/><text x='50' y='68' font-size='55' font-family='Georgia' fill='%23c5a36b' text-anchor='middle'>A</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #f4f6f8; padding-bottom: 40px; }
    .admin-wrap { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .admin-card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
      padding: 25px; margin-bottom: 25px;
      box-shadow: 0 6px 20px rgba(16,36,59,0.05);
    }
    .admin-card h2 {
      font: normal 22px Georgia, serif; color: #10243b; margin: 0 0 15px;
      border-bottom: 1px solid #eee; padding-bottom: 10px;
    }
    .f-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .f-field { display: flex; flex-direction: column; gap: 4px; }
    .f-field.full { grid-column: 1 / -1; }
    .f-field label { font-size: 12px; font-weight: bold; color: #333; }
    .f-field input, .f-field select {
      padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;
      font-family: inherit; font-size: 13px; outline: none; background: #fff;
    }
    .f-field input:focus, .f-field select:focus { border-color: #c5a36b; }
    .check-row { display: flex; gap: 20px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
    .check-row label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .check-row input { width: 16px; height: 16px; }

    .btn-primary {
      width: 100%; padding: 13px; margin-top: 15px; background: #10243b; color: #fff;
      border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer;
      transition: 0.2s;
    }
    .btn-primary:hover { background: #1e3a5f; }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; }

    .offer-item {
      display: flex; gap: 15px; align-items: center; padding: 15px;
      border: 1px solid #e5e7eb; border-radius: 10px; margin-bottom: 12px;
      background: #fafbfc;
    }
    .offer-item img {
      width: 90px; height: 90px; object-fit: cover; border-radius: 8px;
      border: 2px solid #eee; flex-shrink: 0;
    }
    .offer-info { flex: 1; font-size: 12px; color: #555; line-height: 1.7; }
    .offer-info b { color: #10243b; font-size: 14px; }
    .offer-actions { display: flex; flex-direction: column; gap: 6px; }
    .offer-actions button {
      padding: 6px 12px; font-size: 11px; font-weight: bold;
      border-radius: 5px; cursor: pointer; border: 1px solid;
      white-space: nowrap;
    }
    .btn-toggle { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
    .btn-toggle.off { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
    .btn-delete { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
    .btn-delete:hover { background: #fee2e2; }

    .status-badge {
      display: inline-block; padding: 3px 9px; border-radius: 20px;
      font-size: 10px; font-weight: bold; margin-left: 6px;
    }
    .badge-active { background: #d1fae5; color: #065f46; }
    .badge-inactive { background: #fee2e2; color: #991b1b; }
    .badge-expired { background: #fef3c7; color: #92400e; }

    #loginBox { max-width: 380px; margin: 80px auto; }
    #loginBox input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; margin-bottom: 10px; box-sizing: border-box; }

    @media (max-width: 600px) {
      .f-grid { grid-template-columns: 1fr; }
      .offer-item { flex-direction: column; text-align: center; }
      .offer-actions { flex-direction: row; width: 100%; }
      .offer-actions button { flex: 1; }
    }
  </style>
</head>
<body data-no-offers>

<!-- LOGIN -->
<div id="loginBox" class="admin-card" style="display:none;">
  <h2>🔐 Admin Login</h2>
  <input type="password" id="adminPass" placeholder="Enter admin password">
  <button class="btn-primary" onclick="tryLogin()">Login</button>
  <p style="font-size:11px;color:#999;margin-top:10px;text-align:center;">Only authorized personnel.</p>
</div>

<!-- MAIN PANEL -->
<div id="adminPanel" class="admin-wrap" style="display:none;">

  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px;">
    <h1 style="font:normal 26px Georgia,serif;color:#10243b;margin:0;">🎯 Side Offer Manager</h1>
    <div style="display:flex;gap:8px;">
      <a href="index.html" class="header-wa" style="background:#fff;color:var(--navy);border:1px solid var(--navy);">← Home</a>
      <button onclick="logout()" class="header-wa" style="background:#ef4444;border:none;cursor:pointer;">Logout</button>
    </div>
  </div>

  <!-- ADD FORM -->
  <div class="admin-card">
    <h2>➕ Add New Offer</h2>
    <div class="f-grid">
      <div class="f-field full">
        <label>Banner Image URL *</label>
        <input type="url" id="oImg" placeholder="https://example.com/offer.jpg">
      </div>
      <div class="f-field full">
        <label>Click Link (जहाँ जाना है)</label>
        <input type="text" id="oLink" placeholder="print.html या https://wa.me/...">
      </div>
      <div class="f-field">
        <label>Position</label>
        <select id="oPos">
          <option value="right">Right Side</option>
          <option value="left">Left Side</option>
        </select>
      </div>
      <div class="f-field">
        <label>Priority (छोटा = ऊपर)</label>
        <input type="number" id="oPriority" value="1" min="1">
      </div>
      <div class="f-field">
        <label>Start Date (optional)</label>
        <input type="date" id="oStart">
      </div>
      <div class="f-field">
        <label>End Date (optional)</label>
        <input type="date" id="oEnd">
      </div>
    </div>
    <div class="check-row">
      <label><input type="checkbox" id="oActive" checked> Active</label>
      <label><input type="checkbox" id="oClose" checked> Closeable</label>
      <label><input type="checkbox" id="oMobile"> Show on Mobile</label>
    </div>
    <button class="btn-primary" id="saveBtn">Save Offer</button>
  </div>

  <!-- LIST -->
  <div class="admin-card">
    <h2>📋 Existing Offers</h2>
    <div id="offerList"><p style="color:#999;font-size:13px;">Loading...</p></div>
  </div>

</div>

<script type="module">
import { getDb, showToast } from "./shared.js";
import {
  collection, getDocs, addDoc, deleteDoc, doc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const db = getDb();
const ADMIN_PASS = "aaradhya@2026"; // 🔴 इसे बदल लें!

/* ---------- LOGIN ---------- */
const loginBox = document.getElementById("loginBox");
const adminPanel = document.getElementById("adminPanel");

function checkAuth() {
  if (localStorage.getItem("adminAuth") === "yes") {
    loginBox.style.display = "none";
    adminPanel.style.display = "block";
    loadOffers();
  } else {
    loginBox.style.display = "block";
    adminPanel.style.display = "none";
  }
}
window.tryLogin = () => {
  const p = document.getElementById("adminPass").value;
  if (p === ADMIN_PASS) {
    localStorage.setItem("adminAuth", "yes");
    showToast("Login successful!");
    checkAuth();
  } else {
    showToast("Wrong password!", "⚠️");
  }
};
window.logout = () => {
  localStorage.removeItem("adminAuth");
  checkAuth();
};
checkAuth();

/* ---------- SAVE ---------- */
document.getElementById("saveBtn").onclick = async () => {
  const btn = document.getElementById("saveBtn");
  const data = {
    image: document.getElementById("oImg").value.trim(),
    link: document.getElementById("oLink").value.trim() || "#",
    position: document.getElementById("oPos").value,
    priority: Number(document.getElementById("oPriority").value) || 1,
    startDate: document.getElementById("oStart").value || "",
    endDate: document.getElementById("oEnd").value || "",
    active: document.getElementById("oActive").checked,
    closeable: document.getElementById("oClose").checked,
    mobileShow: document.getElementById("oMobile").checked,
    createdAt: new Date().toISOString()
  };

  if (!data.image) {
    showToast("Image URL जरूरी है", "⚠️");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Saving...";
  try {
    await addDoc(collection(db, "sideOffers"), data);
    showToast("Offer added successfully!");
    ["oImg","oLink","oStart","oEnd"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("oPriority").value = "1";
    loadOffers();
  } catch (e) {
    console.error(e);
    showToast("Failed to save. Try again.", "⚠️");
  } finally {
    btn.disabled = false;
    btn.textContent = "Save Offer";
  }
};

/* ---------- LOAD LIST ---------- */
async function loadOffers() {
  const listBox = document.getElementById("offerList");
  try {
    const snap = await getDocs(collection(db, "sideOffers"));
    if (snap.empty) {
      listBox.innerHTML = `<p style="color:#999;font-size:13px;text-align:center;padding:20px;">No offers yet. Add one above 👆</p>`;
      return;
    }

    const offers = [];
    snap.forEach(d => offers.push({ id: d.id, ...d.data() }));
    offers.sort((a,b) => (a.priority||1) - (b.priority||1));

    const today = new Date().toISOString().split("T")[0];

    listBox.innerHTML = offers.map(o => {
      let statusBadge = o.active
        ? `<span class="status-badge badge-active">ACTIVE</span>`
        : `<span class="status-badge badge-inactive">INACTIVE</span>`;
      if (o.endDate && today > o.endDate) {
        statusBadge = `<span class="status-badge badge-expired">EXPIRED</span>`;
      }
      return `
        <div class="offer-item">
          <img src="${o.image}" alt="offer" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23eee%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 font-size=%2214%22 fill=%22%23999%22 text-anchor=%22middle%22>No Img</text></svg>'">
          <div class="offer-info">
            <b>${o.position.toUpperCase()} side</b> ${statusBadge}<br>
            🎯 Priority: ${o.priority || 1} &nbsp;|&nbsp;
            📅 ${o.startDate || "always"} → ${o.endDate || "always"}<br>
            🔗 <span style="word-break:break-all;">${o.link || "—"}</span>
          </div>
          <div class="offer-actions">
            <button class="btn-toggle ${o.active ? "" : "off"}" data-toggle="${o.id}" data-active="${o.active}">
              ${o.active ? "Deactivate" : "Activate"}
            </button>
            <button class="btn-delete" data-del="${o.id}">Delete</button>
          </div>
        </div>
      `;
    }).join("");

    listBox.querySelectorAll("[data-del]").forEach(btn => {
      btn.onclick = async () => {
        if (!confirm("इस offer को delete करें?")) return;
        await deleteDoc(doc(db, "sideOffers", btn.dataset.del));
        showToast("Deleted!");
        loadOffers();
      };
    });
    listBox.querySelectorAll("[data-toggle]").forEach(btn => {
      btn.onclick = async () => {
        await updateDoc(doc(db, "sideOffers", btn.dataset.toggle), {
          active: btn.dataset.active !== "true"
        });
        showToast("Status updated!");
        loadOffers();
      };
    });

  } catch (e) {
    console.error(e);
    listBox.innerHTML = `<p style="color:#c00;">Error loading offers. Check console.</p>`;
  }
}
</script>
</body>
</html>
